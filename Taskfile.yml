version: '3'

env:
  CARGO_TARGET_DIR: '{{.HOME}}/.cache/b10x-target/a2a'

vars:
  A2A_VERSION: v1.0.1
  A2A_SHA256: a148fb439ca2c37e12c10e5f0cfdd2d08f9ee5b1ec96f44593edd05a68bead96
  A2A_SRC: '{{.HOME}}/.cache/a2a-upstream/{{.A2A_VERSION}}'
  A2A_DIR: '{{.A2A_SRC}}/A2A-{{trimPrefix "v" .A2A_VERSION}}'
  SCRATCH: '{{.HOME}}/.cache/a2a-gen'

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: Validate ess/, hold every generated artifact to it, then format, lint and build.
    cmds:
      - task: spec
      - task: projections-drift
      - task: drift
      - task: http-paths
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - cargo build --locked --manifest-path generated/rust/a2a/Cargo.toml --features server

  spec:
    desc: Validate the ESS specification and its ess-http/1 binding.
    cmds:
      - ess specify validate --path ess
      - ess specify http validate --path ess --binding ess/http.yaml

  projections:
    desc: Rewrite generated/openapi, generated/openapi-http, generated/asyncapi and generated/schema from ess/.
    cmds:
      - for: [openapi, asyncapi, schema]
        cmd: ess generate --path ess --kind {{.ITEM}} --out generated/{{.ITEM}}
      - ess generate --path ess --kind openapi --http ess/http.yaml --out generated/openapi-http

  projections-drift:
    desc: Fail when generated/openapi, generated/openapi-http, generated/asyncapi or generated/schema differs from ess/.
    cmds:
      - for: [openapi, asyncapi, schema]
        cmd: ess generate --path ess --kind {{.ITEM}} --out generated/{{.ITEM}} --check
      - ess generate --path ess --kind openapi --http ess/http.yaml --out generated/openapi-http --check

  http-paths:
    desc: Fail when the (method, path) pairs of generated/openapi-http differ from upstream/openapi beyond ess/http-unmapped.tsv.
    cmds:
      - cargo run -q --locked -p a2a-xtask -- http-paths

  generate:
    desc: Rewrite generated/rust/a2a from a fresh synthesis of ess/.
    cmds:
      - cargo run -q --locked -p a2a-xtask -- generate

  drift:
    desc: Fail when generated/rust/a2a differs from a fresh synthesis of ess/.
    cmds:
      - cargo run -q --locked -p a2a-xtask -- drift

  conform-interpreted:
    desc: Run the synthesized suite against the ESS interpreted reference target (not a gate yet).
    cmds:
      - mkdir -p {{.SCRATCH}}/conf
      - ess verify conform synthesize --path ess --scenarios ess --out {{.SCRATCH}}/conf/suite.json
      - ess verify conform run --path ess --target interpreted --suite {{.SCRATCH}}/conf/suite.json --report-format 2 --report-out {{.SCRATCH}}/conf/report.json

  release-check:
    desc: Fail unless TAG is the workspace version and CHANGELOG.md has its entry.
    silent: true
    requires:
      vars: [TAG]
    env:
      RELEASE_TAG: '{{.TAG}}'
    cmds:
      - cmd: |
          set -eu
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "release-check: tag '$RELEASE_TAG' is not a bare version such as 0.1.0" >&2
            exit 1
          fi
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "release-check: tag '$RELEASE_TAG' is not the workspace version '$version' in Cargo.toml" >&2
            exit 1
          fi
          if ! awk -v head="## [$RELEASE_TAG] - " 'index($0, head) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "release-check: CHANGELOG.md has no '## [$RELEASE_TAG] - <date>' entry" >&2
            exit 1
          fi
          echo "release-check: $RELEASE_TAG is the workspace version and has a CHANGELOG.md entry"

  release-artifacts:
    desc: Write the release assets for TAG into OUT (default dist) with a SHA256SUMS file.
    requires:
      vars: [TAG]
    vars:
      OUT: '{{.OUT | default "dist"}}'
      BUNDLE: a2a-{{.TAG}}-specification
    cmds:
      - rm -rf {{.OUT}}
      - mkdir -p {{.OUT}}/{{.BUNDLE}}
      - cp -r ess upstream {{.OUT}}/{{.BUNDLE}}/
      - mkdir -p {{.OUT}}/{{.BUNDLE}}/generated
      - for: [openapi, asyncapi, schema]
        cmd: cp -r generated/{{.ITEM}}/{{.ITEM}} {{.OUT}}/{{.BUNDLE}}/generated/{{.ITEM}}
      - cp LICENSE CHANGELOG.md {{.OUT}}/{{.BUNDLE}}/
      - tar -C {{.OUT}} --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -czf {{.OUT}}/{{.BUNDLE}}.tar.gz {{.BUNDLE}}
      - tar -C generated/schema --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -czf {{.OUT}}/a2a-{{.TAG}}-json-schema.tar.gz schema
      - cp upstream/a2a.proto {{.OUT}}/a2a.proto
      - cp upstream/openapi/a2a.openapi.yaml {{.OUT}}/a2a-{{.TAG}}-upstream.openapi.yaml
      - cp generated/openapi/openapi/a2a-agent.yaml {{.OUT}}/a2a-{{.TAG}}.openapi.yaml
      - cp generated/asyncapi/asyncapi/a2a-agent.yaml {{.OUT}}/a2a-{{.TAG}}.asyncapi.yaml
      - rm -rf {{.OUT}}/{{.BUNDLE}}
      - cd {{.OUT}} && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS && sha256sum --check --strict SHA256SUMS

  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate

  upstream-fetch:
    desc: Download the pinned A2A release tarball and verify its sha256.
    status:
      - test -d {{.A2A_DIR}}
    cmds:
      - mkdir -p {{.A2A_SRC}}
      - curl -fsSL -o {{.A2A_SRC}}/src.tar.gz https://github.com/a2aproject/A2A/archive/refs/tags/{{.A2A_VERSION}}.tar.gz
      - echo "{{.A2A_SHA256}}  {{.A2A_SRC}}/src.tar.gz" | sha256sum -c -
      - tar -xzf {{.A2A_SRC}}/src.tar.gz -C {{.A2A_SRC}}

  upstream:
    desc: Refresh upstream/ from the pinned release, then derive upstream/openapi/a2a.openapi.yaml.
    deps: [upstream-fetch]
    cmds:
      - cp {{.A2A_DIR}}/specification/a2a.proto upstream/a2a.proto
      - cp {{.A2A_DIR}}/LICENSE upstream/LICENSE
      - mkdir -p {{.SCRATCH}}/openapiv2
      - buf generate {{.A2A_DIR}}/specification --template upstream/buf.gen.openapiv2.yaml -o {{.SCRATCH}}/openapiv2
      - npx -y swagger2openapi@7 --yaml --outfile upstream/openapi/a2a.openapi.yaml {{.SCRATCH}}/openapiv2/a2a.swagger.yaml
