[package]
name = "a2a-server"
description = "A2A's HTTP+JSON binding over the generated a2a crate: its twelve obligations in memory, the upstream routes, SSE streaming and an echo reference agent."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
a2a = { path = "../../generated/rust/a2a", features = ["server"] }
clap = { workspace = true }
time = { version = "=0.3.45", features = ["formatting", "parsing"] }
uuid = { version = "=1.26.1", features = ["v4"] }
