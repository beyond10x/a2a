components:
  - component: a2a-agent
    summary: An A2A server agent, reached over JSON-RPC, gRPC or HTTP+JSON (A2A v1.0.1 section 5).
    # JSON-RPC binding (A2A v1.0.1 section 9). Section 9.1: "Protocol: JSON-RPC 2.0 over
    # HTTP(S)", "Method Naming: PascalCase method names matching gRPC conventions (e.g.,
    # `SendMessage`, `GetTask`)". Each method is the local name of the command it invokes, and
    # ListTasks is the view a2a.tasks.Tasks (domains/tasks.yaml, before `commands:`); each A2A
    # error's summary carries its section 5.4 code. One authored scenario per method,
    # scenarios/jsonrpc-*.yaml, names the command and claims the errors that carry its codes.
    # UNMAPPED (ESS gap): the binding itself. ESS 0.67.0 binds a command to an HTTP route
    # (ess-http/1), one method and path each, while JSON-RPC sends every method to one endpoint
    # and dispatches on the body's `method`. Two commands on `post /` are refused:
    # "ESS-HTTP-010: routes[1]: two operations claim the same method and path: command
    # `a2a.tasks.CancelTask` (`routes[1]`, `post /`) and command `a2a.tasks.GetTask`
    # (`routes[0]`, `post /`) are one route on component `a2a-agent`, since variable names do
    # not tell two templates apart". `ess generate --kind` offers docs, site, docs-ir, schema,
    # openapi and asyncapi, no JSON-RPC or OpenRPC document, and ess-protospec/1 models
    # communicating peers, not a wire binding. So no scenario reads a method name or a numeric
    # code off the wire: an act names a command by its qualified name, and an error claim
    # carrying the code is refused, "ESS-AUTHOR-013: the fields of `a2a.tasks.TaskNotFound`
    # declares no `code`". Missing construct: a JSON-RPC binding naming a method per command and
    # view and a numeric code per error, over one endpoint, that a conformance target serves.
    # The standard codes of section 9.5 belong to that binding: "| `-32700` | `JSONParseError` |
    # "Invalid JSON payload" | The server received invalid JSON |", "| `-32600` |
    # `InvalidRequestError` | "Request payload validation error" | The JSON sent is not a valid
    # Request object |", "| `-32601` | `MethodNotFoundError` | "Method not found" | The requested
    # method does not exist or is not available |", "| `-32602` | `InvalidParamsError` |
    # "Invalid parameters" | The method parameters are invalid |", "| `-32603` | `InternalError` |
    # "Internal error" | An internal error occurred on the server |". -32700 and -32600 concern
    # the request envelope before a method is read; -32601 is a method that names no command or
    # view this component accepts; -32602 is params a command's input declaration rejects, and
    # the errors a2a.tasks.ContextMismatch and ContextNotAccepted answer it too (section 3.3.2).
    # UNMAPPED (ESS gap): no authored scenario holds -32601 or -32602. An act expects one
    # refusal, `refused: not_granted`; there is none for an input the declaration rejects or for
    # an unknown command, and a scenario naming an undeclared command is refused by name.
    owns:
      domains:
        - a2a.tasks
        - a2a.discovery
    accepts:
      commands:
        - a2a.tasks.SendMessage
        - a2a.tasks.SendStreamingMessage
        - a2a.tasks.GetTask
        - a2a.tasks.CancelTask
        - a2a.tasks.SubscribeToTask
        - a2a.tasks.CreateTaskPushNotificationConfig
        - a2a.tasks.GetTaskPushNotificationConfig
        - a2a.tasks.ListTaskPushNotificationConfigs
        - a2a.tasks.DeleteTaskPushNotificationConfig
        - a2a.tasks.StartWorking
        - a2a.tasks.RequireInput
        - a2a.tasks.RequireAuth
        - a2a.tasks.CompleteTask
        - a2a.tasks.FailTask
        - a2a.tasks.RejectTask
        - a2a.tasks.UpdateArtifact
        - a2a.discovery.GetExtendedAgentCard
    # UNMAPPED (ESS gap): push delivery. Section 4.3.3: "When a task update occurs, the agent
    # sends an HTTP POST request to the configured webhook URL", and the same section: "Agents MUST
    # attempt delivery at least once for each configured webhook". ESS 0.67.0 publishes an event
    # to subscribers of a component; it has no construct for delivering an event to an endpoint
    # a stored row names (PushNotificationConfig.url), with that row's credentials. Missing
    # construct: an outbound delivery addressed by entity data.
    publishes:
      events:
        - a2a.tasks.TaskCreated
        - a2a.tasks.TaskStatusUpdated
        - a2a.tasks.TaskArtifactUpdated
        - a2a.tasks.PushNotificationConfigCreated
        - a2a.tasks.PushNotificationConfigDeleted
        - a2a.tasks.MessageStreamResponse
        - a2a.tasks.TaskSubscriptionResponse
    # UNMAPPED (ESS gap): the stream transport. Section 11.7: "REST streaming uses Server-Sent
    # Events", answering `Content-Type: text/event-stream` with one `data:` line per
    # StreamResponse; JSON-RPC streams over SSE too (section 9.4.2), gRPC as a server stream (10.7).
    # ESS 0.67.0 binds published events to a broker through an ess-transport/1 or /2 document,
    # and its one protocol is NATS: `brokers: [{id: agent, protocol: sse}]` is refused,
    # "brokers[0].protocol: unknown variant `sse`, expected `nats`". So the AsyncAPI channels of
    # the two stream events carry their address (the opening command's wire name) and no
    # binding. Missing construct: a channel bound to the response of the command that opens it,
    # over SSE.
    reached_by: network
