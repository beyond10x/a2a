domain: a2a.discovery

summary: >-
  The Agent Card an A2A agent publishes about itself: identity, interfaces, capabilities, skills and
  security schemes (A2A v1.0.1 section 4.4, proto messages AgentCard and below).

naming:
  wire: discovery
  display: Discovery

types:
  - name: a2a.discovery.AgentInterface
    kind: struct
    naming:
      summary: A URL and protocol binding the agent is reached at (proto AgentInterface).
    fields:
      - name: url
        type: String
      - name: protocol_binding
        type: String
        naming: {wire: protocolBinding}
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: protocol_version
        type: String
        naming: {wire: protocolVersion}

  - name: a2a.discovery.AgentProvider
    kind: struct
    fields:
      - name: url
        type: String
      - name: organization
        type: String

  - name: a2a.discovery.AgentExtension
    kind: struct
    fields:
      - name: uri
        type: Optional<String>
        presence: omitted_when_absent
      - name: description
        type: Optional<String>
        presence: omitted_when_absent
      - name: required
        type: Optional<Boolean>
        presence: omitted_when_absent
      - name: params
        type: Optional<Json>

  - name: a2a.discovery.AgentCapabilities
    kind: struct
    fields:
      - name: streaming
        type: Optional<Boolean>
        presence: omitted_when_absent
      - name: push_notifications
        type: Optional<Boolean>
        naming: {wire: pushNotifications}
        presence: omitted_when_absent
      - name: extensions
        type: Optional<List<a2a.discovery.AgentExtension>>
        presence: omitted_when_absent
      - name: extended_agent_card
        type: Optional<Boolean>
        naming: {wire: extendedAgentCard}
        presence: omitted_when_absent

  - name: a2a.discovery.StringList
    kind: struct
    fields:
      - name: list
        type: List<String>

  - name: a2a.discovery.SecurityRequirement
    kind: struct
    fields:
      - name: schemes
        type: Map<String, a2a.discovery.StringList>

  - name: a2a.discovery.AgentSkill
    kind: struct
    fields:
      - name: id
        type: String
      - name: name
        type: String
      - name: description
        type: String
      - name: tags
        type: List<String>
      - name: examples
        type: Optional<List<String>>
        presence: omitted_when_absent
      - name: input_modes
        type: Optional<List<String>>
        naming: {wire: inputModes}
        presence: omitted_when_absent
      - name: output_modes
        type: Optional<List<String>>
        naming: {wire: outputModes}
        presence: omitted_when_absent
      - name: security_requirements
        type: Optional<List<a2a.discovery.SecurityRequirement>>
        naming: {wire: securityRequirements}
        presence: omitted_when_absent

  - name: a2a.discovery.AgentCardSignature
    kind: struct
    fields:
      - name: protected
        type: String
      - name: signature
        type: String
      - name: header
        type: Optional<Json>

  - name: a2a.discovery.APIKeySecurityScheme
    kind: struct
    fields:
      - name: description
        type: Optional<String>
        presence: omitted_when_absent
      - name: location
        type: String
      - name: name
        type: String

  - name: a2a.discovery.HTTPAuthSecurityScheme
    kind: struct
    fields:
      - name: description
        type: Optional<String>
        presence: omitted_when_absent
      - name: scheme
        type: String
      - name: bearer_format
        type: Optional<String>
        naming: {wire: bearerFormat}
        presence: omitted_when_absent

  - name: a2a.discovery.AuthorizationCodeOAuthFlow
    kind: struct
    fields:
      - name: authorization_url
        type: String
        naming: {wire: authorizationUrl}
      - name: token_url
        type: String
        naming: {wire: tokenUrl}
      - name: refresh_url
        type: Optional<String>
        naming: {wire: refreshUrl}
        presence: omitted_when_absent
      - name: scopes
        type: Map<String, String>
      - name: pkce_required
        type: Optional<Boolean>
        naming: {wire: pkceRequired}
        presence: omitted_when_absent

  - name: a2a.discovery.ClientCredentialsOAuthFlow
    kind: struct
    fields:
      - name: token_url
        type: String
        naming: {wire: tokenUrl}
      - name: refresh_url
        type: Optional<String>
        naming: {wire: refreshUrl}
        presence: omitted_when_absent
      - name: scopes
        type: Map<String, String>

  - name: a2a.discovery.ImplicitOAuthFlow
    kind: struct
    naming:
      summary: Deprecated in A2A v1.0.1.
    fields:
      - name: authorization_url
        type: Optional<String>
        naming: {wire: authorizationUrl}
        presence: omitted_when_absent
      - name: refresh_url
        type: Optional<String>
        naming: {wire: refreshUrl}
        presence: omitted_when_absent
      - name: scopes
        type: Optional<Map<String, String>>
        presence: omitted_when_absent

  - name: a2a.discovery.PasswordOAuthFlow
    kind: struct
    naming:
      summary: Deprecated in A2A v1.0.1.
    fields:
      - name: token_url
        type: Optional<String>
        naming: {wire: tokenUrl}
        presence: omitted_when_absent
      - name: refresh_url
        type: Optional<String>
        naming: {wire: refreshUrl}
        presence: omitted_when_absent
      - name: scopes
        type: Optional<Map<String, String>>
        presence: omitted_when_absent

  - name: a2a.discovery.DeviceCodeOAuthFlow
    kind: struct
    fields:
      - name: device_authorization_url
        type: String
        naming: {wire: deviceAuthorizationUrl}
      - name: token_url
        type: String
        naming: {wire: tokenUrl}
      - name: refresh_url
        type: Optional<String>
        naming: {wire: refreshUrl}
        presence: omitted_when_absent
      - name: scopes
        type: Map<String, String>

  # a2a.proto, message OAuthFlows, `oneof flow`; ProtoJSON writes the chosen member under its
  # own camelCase name ({"clientCredentials": {...}}), not as a tagged object, so each member
  # is an Optional field here: that is the wire form.
  # UNMAPPED (ESS gap): the exactly-one rule of the oneof. ESS 0.67.0 has no externally tagged
  # union (a union without `tag:` is refused: "missing field `tag`"). The rule validates as a
  # type invariant (`any: [all: [defined(authorization_code), not defined(client_credentials),
  # …], …]`), but synthesis then refuses it twice: "ESS-SYNTH-013: type
  # a2a.discovery.OAuthFlows has no scenario" (no view publishes it) and "ESS-SYNTH-001: outcome
  # a2a.discovery.GetExtendedAgentCard/returned has no scenario … record invariant on a response
  # type a2a.discovery.OAuthFlows has no executable observer". Missing construct: a union keyed
  # by member name, or a response-type invariant the response observer checks.
  - name: a2a.discovery.OAuthFlows
    kind: struct
    fields:
      - name: authorization_code
        type: Optional<a2a.discovery.AuthorizationCodeOAuthFlow>
        naming: {wire: authorizationCode}
        presence: omitted_when_absent
      - name: client_credentials
        type: Optional<a2a.discovery.ClientCredentialsOAuthFlow>
        naming: {wire: clientCredentials}
        presence: omitted_when_absent
      - name: implicit
        type: Optional<a2a.discovery.ImplicitOAuthFlow>
        presence: omitted_when_absent
      - name: password
        type: Optional<a2a.discovery.PasswordOAuthFlow>
        presence: omitted_when_absent
      - name: device_code
        type: Optional<a2a.discovery.DeviceCodeOAuthFlow>
        naming: {wire: deviceCode}
        presence: omitted_when_absent

  - name: a2a.discovery.OAuth2SecurityScheme
    kind: struct
    fields:
      - name: description
        type: Optional<String>
        presence: omitted_when_absent
      - name: flows
        type: a2a.discovery.OAuthFlows
      - name: oauth2_metadata_url
        type: Optional<String>
        naming: {wire: oauth2MetadataUrl}
        presence: omitted_when_absent

  - name: a2a.discovery.OpenIdConnectSecurityScheme
    kind: struct
    fields:
      - name: description
        type: Optional<String>
        presence: omitted_when_absent
      - name: open_id_connect_url
        type: String
        naming: {wire: openIdConnectUrl}

  - name: a2a.discovery.MutualTlsSecurityScheme
    kind: struct
    fields:
      - name: description
        type: Optional<String>
        presence: omitted_when_absent

  # a2a.proto, message SecurityScheme, `oneof scheme`; ProtoJSON writes the chosen member under
  # its own camelCase name ({"apiKeySecurityScheme": {...}}), so each member is an Optional
  # field here: that is the wire form.
  # UNMAPPED (ESS gap): the exactly-one rule of the oneof, as for OAuthFlows above.
  - name: a2a.discovery.SecurityScheme
    kind: struct
    fields:
      - name: api_key_security_scheme
        type: Optional<a2a.discovery.APIKeySecurityScheme>
        naming: {wire: apiKeySecurityScheme}
        presence: omitted_when_absent
      - name: http_auth_security_scheme
        type: Optional<a2a.discovery.HTTPAuthSecurityScheme>
        naming: {wire: httpAuthSecurityScheme}
        presence: omitted_when_absent
      - name: oauth2_security_scheme
        type: Optional<a2a.discovery.OAuth2SecurityScheme>
        naming: {wire: oauth2SecurityScheme}
        presence: omitted_when_absent
      - name: open_id_connect_security_scheme
        type: Optional<a2a.discovery.OpenIdConnectSecurityScheme>
        naming: {wire: openIdConnectSecurityScheme}
        presence: omitted_when_absent
      - name: mtls_security_scheme
        type: Optional<a2a.discovery.MutualTlsSecurityScheme>
        naming: {wire: mtlsSecurityScheme}
        presence: omitted_when_absent

  - name: a2a.discovery.AgentCard
    kind: struct
    naming:
      summary: Self-describing manifest of an agent (A2A v1.0.1 section 4.4.1).
    fields:
      - name: name
        type: String
      - name: description
        type: String
      - name: supported_interfaces
        type: List<a2a.discovery.AgentInterface>
        naming: {wire: supportedInterfaces}
      - name: provider
        type: Optional<a2a.discovery.AgentProvider>
        presence: omitted_when_absent
      - name: version
        type: String
      - name: documentation_url
        type: Optional<String>
        naming: {wire: documentationUrl}
        presence: omitted_when_absent
      - name: capabilities
        type: a2a.discovery.AgentCapabilities
      - name: security_schemes
        type: Optional<Map<String, a2a.discovery.SecurityScheme>>
        naming: {wire: securitySchemes}
        presence: omitted_when_absent
      - name: security_requirements
        type: Optional<List<a2a.discovery.SecurityRequirement>>
        naming: {wire: securityRequirements}
        presence: omitted_when_absent
      - name: default_input_modes
        type: List<String>
        naming: {wire: defaultInputModes}
      - name: default_output_modes
        type: List<String>
        naming: {wire: defaultOutputModes}
      - name: skills
        type: List<a2a.discovery.AgentSkill>
      - name: signatures
        type: Optional<List<a2a.discovery.AgentCardSignature>>
        presence: omitted_when_absent
      - name: icon_url
        type: Optional<String>
        naming: {wire: iconUrl}
        presence: omitted_when_absent

actors:
  - name: a2a.discovery.Client
    naming:
      display: A2A client
      summary: An authenticated caller of the agent's A2A interface.
    may:
      - a2a.discovery.GetExtendedAgentCard

errors:
  - name: a2a.discovery.UnsupportedOperation
    summary: >-
      UnsupportedOperationError (JSON-RPC -32004, HTTP 400): the agent card does not declare
      capabilities.extendedAgentCard.
  - name: a2a.discovery.ExtendedAgentCardNotConfigured
    summary: >-
      ExtendedAgentCardNotConfiguredError (JSON-RPC -32007, HTTP 400): the agent declares the
      capability but has no extended card configured.
  - name: a2a.discovery.VersionNotSupported
    summary: VersionNotSupportedError (JSON-RPC -32009, gRPC FAILED_PRECONDITION, HTTP 400).
  - name: a2a.discovery.ExtensionSupportRequired
    summary: ExtensionSupportRequiredError (JSON-RPC -32008, gRPC FAILED_PRECONDITION, HTTP 400).

# Section 3.2.6 sends the service parameters (A2A-Version, A2A-Extensions) with every request,
# and section 3.6.2: "If the version is not supported by the interface, agents MUST return a
# VersionNotSupportedError", GetExtendedAgentCard included (as a2a.tasks protocol-negotiation).
outcome_groups:
  - name: discovery-protocol-negotiation
    actor: a2a.discovery.Client
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        error: a2a.discovery.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        error: a2a.discovery.ExtensionSupportRequired

commands:
  - name: a2a.discovery.GetExtendedAgentCard
    naming:
      wire: extendedAgentCard
      display: Get extended agent card
      summary: >-
        Return the Agent Card an authenticated client may see, possibly with more skills than the
        public card (A2A v1.0.1 section 3.1.11; GET /extendedAgentCard).
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
    response:
      - name: card
        type: a2a.discovery.AgentCard
    outcomes:
      - name: not-supported
        external: the public agent card does not declare capabilities.extendedAgentCard
        error: a2a.discovery.UnsupportedOperation
      - name: not-configured
        external: the agent declares the capability but has no extended card configured
        error: a2a.discovery.ExtendedAgentCardNotConfigured
      - name: returned
        returns: true
        summary: The extended Agent Card.
