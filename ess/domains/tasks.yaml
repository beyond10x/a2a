      - name: context-not-accepted
        external: >-
          the agent cannot accept the contextId the client provided, and generates none in its
          place (section 3.4.1)
        error: a2a.tasks.ContextNotAccepted
      - name: content-type-not-supported
        external: a part's media type is not supported by the agent
        error: a2a.tasks.ContentTypeNotSupported
      # The agent's own bounds (section 13.4, see ResourceExhausted). The bound is the server's
      # (`--max-tasks`, `--max-history`), not a stored field, so both branches are external, and
      # neither stores the message.
      - name: task-limit
        external: >-
          the message names no task, the agent would create one, and the tenant of the request,
          or every request without one, already holds as many tasks as the agent keeps
        error: a2a.tasks.ResourceExhausted
      - name: history-limit
        external: >-
          message.taskId names a task whose history already holds as many messages as the agent
          keeps
        error: a2a.tasks.ResourceExhausted
      # A message to a running task changes no state and no stored field the protocol fixes.
      # Section 3.4.3: "Clients MAY use taskId (with or without contextId) to continue or refine
      # a specific task"; section 3.7: "The agent is responsible to determine which Messages are
