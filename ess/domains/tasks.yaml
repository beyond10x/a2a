events:
  - name: a2a.tasks.TaskCreated
    fields:
      - name: task_id
        type: a2a.tasks.TaskId

  - name: a2a.tasks.TaskStatusUpdated
    naming:
      summary: Emitted on every lifecycle move; streamed and pushed as TaskStatusUpdateEvent.
    fields:
      - name: task_id
        type: a2a.tasks.TaskId
      - name: context_id
        type: a2a.tasks.ContextId

  - name: a2a.tasks.PushNotificationConfigCreated
    fields:
      - name: config_id
        type: a2a.tasks.PushNotificationConfigId
      - name: task_id
        type: a2a.tasks.TaskId

  - name: a2a.tasks.PushNotificationConfigDeleted
    fields:
      - name: config_id
        type: a2a.tasks.PushNotificationConfigId
      - name: task_id
        type: a2a.tasks.TaskId

views:
  # UNMAPPED: ListTasks (A2A v1.0.1 section 3.1.4) filters by an optional contextId, an
  # optional status and an optional statusTimestampAfter, pages by cursor and orders by status
  # timestamp descending. Only the unfiltered read is declared.
  - name: a2a.tasks.Tasks
    source: a2a.tasks.Task
    consistency: read_your_writes
    naming:
      wire: tasks
      display: List tasks
    fields:
      - name: id
        type: a2a.tasks.TaskId
      - name: context_id
        type: a2a.tasks.ContextId
      - name: state
        type: a2a.tasks.Task.State
      - name: status_message
        type: Optional<a2a.tasks.Message>
      - name: status_timestamp
        type: Optional<Timestamp>
      - name: artifacts
        type: Optional<List<a2a.tasks.Artifact>>
      - name: history
        type: Optional<List<a2a.tasks.Message>>
      - name: metadata
        type: Optional<Json>

  - name: a2a.tasks.TaskPushNotificationConfigs
    source: a2a.tasks.PushNotificationConfig
    consistency: read_your_writes
    params:
      - name: task_id
        type: a2a.tasks.TaskId
    filter: task_id == param.task_id
    naming:
      wire: pushNotificationConfigs
      display: List push notification configs
    fields:
      - name: id
        type: a2a.tasks.PushNotificationConfigId
      - name: task_id
        type: a2a.tasks.TaskId
      - name: tenant
        type: Optional<String>
      - name: url
        type: String
      - name: token
        type: Optional<String>
      - name: authentication
        type: Optional<a2a.tasks.AuthenticationInfo>

  # Not an A2A operation: every configuration with its identity and state, so a conformance run
  # can observe a configuration it did not address by task.
  - name: a2a.tasks.PushNotificationConfigs
    source: a2a.tasks.PushNotificationConfig
    consistency: read_your_writes
    naming:
      wire: allPushNotificationConfigs
      display: All push notification configs
    fields:
      - name: id
        type: a2a.tasks.PushNotificationConfigId
      - name: state
        type: a2a.tasks.PushNotificationConfig.State
      - name: task_id
        type: a2a.tasks.TaskId
      - name: tenant
        type: Optional<String>
      - name: url
        type: String
      - name: token
        type: Optional<String>
      - name: authentication
        type: Optional<a2a.tasks.AuthenticationInfo>
