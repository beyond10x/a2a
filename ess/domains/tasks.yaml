      # depend on `message.taskId`, a member of the `message` input. ESS 0.67.0 addresses a row
      # (`instance:`, `when_related: {via: …}`) through a top-level input only:
      # `when_related: {via: input.message.task_id, exists: false}` is refused with
      # "ESS-COMMAND-001: `message.task_id` is not an input of `a2a.tasks.SendMessage`". So
      # they are written as `external:` and nothing checks them, and neither does anything check
      # section 3.4.3 "Agents MUST infer contextId from the task if only taskId is provided" on
      # `continued`. Missing construct: a row addressed through a member of a struct input.
