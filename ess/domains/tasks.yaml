          tenant is not one (GetTask `other-tenant`)
        error: a2a.tasks.TaskNotFound
      - name: task-terminal
        external: message.taskId names a task in Completed, Failed, Canceled or Rejected
        error: a2a.tasks.UnsupportedOperation
      - name: context-mismatch
        external: message.contextId differs from the contextId of the task message.taskId names
        error: a2a.tasks.ContextMismatch
      - name: context-not-accepted
        external: >-
