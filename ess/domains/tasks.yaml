        creates: a2a.tasks.Task
        instance: task_id
        sets:
          context_id: {input: message.context_id, else: {generated: true}}
          tenant: input.tenant
          status_timestamp: {generated: true}
        emits: [a2a.tasks.TaskCreated]
        payload:
          a2a.tasks.TaskCreated:
            task_id: {generated: true}
        returns: true
        summary: >-
          A new task. With returnImmediately true the answer carries it as created; otherwise
          the answer waits until it is terminal or interrupted.

