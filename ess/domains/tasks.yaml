        external: >-
          the message names no task, the agent would create one, and the tenant of the request,
          or every request without one, already holds as many tasks as the agent keeps
        error: a2a.tasks.ResourceExhausted
      - name: history-limit
        external: >-
          message.taskId names a task whose history already holds as many messages as the agent
          keeps
        error: a2a.tasks.ResourceExhausted
      # A message to a running task changes no state and no stored field the protocol fixes.
      # Section 3.4.3: "Clients MAY use taskId (with or without contextId) to continue or refine
      # a specific task"; section 3.7: "The agent is responsible to determine which Messages are
      # persisted in the Task History." The agent moves the task afterwards with the agent-side
      # commands below (StartWorking, RequireInput, …).
      - name: continued
        external: message.taskId names a non-terminal task, and the agent takes the message into it
        returns: true
        summary: The agent answers with the task the message continued, in the state it holds.
      - name: direct-message
        external: the agent answers with a message and creates no task
        returns: true
