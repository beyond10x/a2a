domain: a2a.tasks

summary: >-
  Tasks an A2A agent runs for its clients, the messages and artifacts they carry, and the
  push-notification configurations that follow them (A2A v1.0.1 sections 3 and 4.1-4.3, proto
  service A2AService).

naming:
  wire: tasks
  display: Tasks

types:
  - name: a2a.tasks.TaskId
    kind: newtype
    of: String
    naming:
      summary: Server-generated, opaque task identifier (A2A v1.0.1 section 3.4.2).

  - name: a2a.tasks.ContextId
    kind: newtype
    of: String
    naming:
      summary: Identifier grouping related tasks and messages (A2A v1.0.1 section 3.4.1).

  - name: a2a.tasks.PushNotificationConfigId
    kind: newtype
    of: String

  # No A2A source: the opaque row identity of PushNotificationConfig, which stands in for the
  # struct (task_id, config_id) ESS 0.67.0 refuses (see PushNotificationConfig).
  - name: a2a.tasks.PushNotificationConfigRow
    kind: newtype
    of: String

  - name: a2a.tasks.Role
    kind: enum
    variants: [ROLE_USER, ROLE_AGENT]

  # The wire value of `status.state`. The lifecycle of a2a.tasks.Task names the same states in
  # upper camel case: TASK_STATE_INPUT_REQUIRED is InputRequired, and so on.
  # TASK_STATE_UNSPECIFIED is the proto3 zero value and no state a task holds.
  - name: a2a.tasks.TaskState
    kind: enum
    naming: {code: WireTaskState}
    variants:
      - TASK_STATE_SUBMITTED
      - TASK_STATE_WORKING
      - TASK_STATE_COMPLETED
      - TASK_STATE_FAILED
      - TASK_STATE_CANCELED
      - TASK_STATE_INPUT_REQUIRED
      - TASK_STATE_REJECTED
      - TASK_STATE_AUTH_REQUIRED

  # proto `oneof content` (a2a.proto, message Part) admits exactly one of text, raw, url and
  # data, and ProtoJSON writes the chosen member inline under its own name, so the four are
  # Optional members here: that is the wire form.
  # UNMAPPED (ESS gap): the exactly-one rule. ESS 0.67.0 validates it as a type invariant
  # (`any: [all: [defined(text), not defined(raw), …], …]`), but Part is reachable from the
  # typed responses of GetTask, CancelTask, SubscribeToTask and SendMessage, and synthesis then
  # refuses each returning outcome: "ESS-SYNTH-001: … record invariant on a response type
  # a2a.tasks.Part has no executable observer". Missing construct: a record invariant on a
  # response type that the response observer checks.
  - name: a2a.tasks.Part
    kind: struct
    naming:
      summary: One piece of content in a message or artifact (A2A v1.0.1 section 4.1.6).
    fields:
      - name: text
        type: Optional<String>
        presence: omitted_when_absent
      - name: raw
        type: Optional<Bytes>
        presence: omitted_when_absent
      - name: url
        type: Optional<String>
        presence: omitted_when_absent
      - name: data
        type: Optional<Json>
      - name: metadata
        type: Optional<Json>
      - name: filename
        type: Optional<String>
        presence: omitted_when_absent
      - name: media_type
        type: Optional<String>
        naming: {wire: mediaType}
        presence: omitted_when_absent

  - name: a2a.tasks.Message
    kind: struct
    naming:
      summary: One turn of communication between client and agent (A2A v1.0.1 section 4.1.4).
    fields:
      - name: message_id
        type: String
        naming: {wire: messageId}
      - name: context_id
        type: Optional<a2a.tasks.ContextId>
        naming: {wire: contextId}
        presence: omitted_when_absent
      - name: task_id
        type: Optional<a2a.tasks.TaskId>
        naming: {wire: taskId}
        presence: omitted_when_absent
      - name: role
        type: a2a.tasks.Role
      - name: parts
        type: List<a2a.tasks.Part>
      - name: metadata
        type: Optional<Json>
      - name: extensions
        type: Optional<List<String>>
        presence: omitted_when_absent
      - name: reference_task_ids
        type: Optional<List<a2a.tasks.TaskId>>
        naming: {wire: referenceTaskIds}
        presence: omitted_when_absent

  # UNMAPPED (ESS gap): a2a.proto, Artifact.artifact_id: "It must be unique within a task", and
  # Artifact.parts: "Must contain at least one part." The second validates as a type invariant
  # (`parts.count >= 1`), but synthesis refuses it: "record invariant on a response type
  # `a2a.tasks.Artifact` has no executable observer". The first needs a uniqueness rule over the
  # members of a stored list, which ESS 0.67.0 has no construct for. Missing constructs: a
  # response-type invariant the response observer checks, and a key over a stored list.
  - name: a2a.tasks.Artifact
    kind: struct
    naming:
      summary: An output the agent produced for a task (A2A v1.0.1 section 4.1.7).
    fields:
      - name: artifact_id
        type: String
        naming: {wire: artifactId}
      - name: name
        type: Optional<String>
        presence: omitted_when_absent
      - name: description
        type: Optional<String>
        presence: omitted_when_absent
      - name: parts
        type: List<a2a.tasks.Part>
      - name: metadata
        type: Optional<Json>
      - name: extensions
        type: Optional<List<String>>
        presence: omitted_when_absent

  - name: a2a.tasks.TaskStatus
    kind: struct
    fields:
      - name: state
        type: a2a.tasks.TaskState
      - name: message
        type: Optional<a2a.tasks.Message>
        presence: omitted_when_absent
      - name: timestamp
        type: Optional<Timestamp>
        presence: omitted_when_absent

  - name: a2a.tasks.TaskSnapshot
    kind: struct
    naming:
      summary: The wire form of a task, proto message Task (A2A v1.0.1 section 4.1.1).
    fields:
      - name: id
        type: a2a.tasks.TaskId
      # a2a.proto, Task: `string context_id = 2;` carries no REQUIRED, unlike `id` and `status`.
      - name: context_id
        type: Optional<a2a.tasks.ContextId>
        naming: {wire: contextId}
        presence: omitted_when_absent
      - name: status
        type: a2a.tasks.TaskStatus
      - name: artifacts
        type: Optional<List<a2a.tasks.Artifact>>
        presence: omitted_when_absent
      - name: history
        type: Optional<List<a2a.tasks.Message>>
        presence: omitted_when_absent
      - name: metadata
        type: Optional<Json>

  # The two update members of a stream element (proto StreamResponse.status_update and
  # .artifact_update). They repeat the fields of the events a2a.tasks.TaskStatusUpdated and
  # a2a.tasks.TaskArtifactUpdated because an ESS event is not a type a field can hold.
  - name: a2a.tasks.TaskStatusUpdateEvent
    kind: struct
    naming:
      summary: >-
        "An event sent by the agent to notify the client of a change in a task's status"
        (a2a.proto TaskStatusUpdateEvent; A2A v1.0.1 section 4.2.1).
    fields:
      - name: task_id
        type: a2a.tasks.TaskId
        naming: {wire: taskId}
      - name: context_id
        type: a2a.tasks.ContextId
        naming: {wire: contextId}
      - name: status
        type: a2a.tasks.TaskStatus
      - name: metadata
        type: Optional<Json>

  - name: a2a.tasks.TaskArtifactUpdateEvent
    kind: struct
    naming:
      summary: >-
        "A task delta where an artifact has been generated" (a2a.proto TaskArtifactUpdateEvent;
        A2A v1.0.1 section 4.2.2).
    fields:
      - name: task_id
        type: a2a.tasks.TaskId
        naming: {wire: taskId}
      - name: context_id
        type: a2a.tasks.ContextId
        naming: {wire: contextId}
      - name: artifact
        type: a2a.tasks.Artifact
      - name: append
        type: Optional<Boolean>
        presence: omitted_when_absent
      - name: last_chunk
        type: Optional<Boolean>
        naming: {wire: lastChunk}
        presence: omitted_when_absent
      - name: metadata
        type: Optional<Json>

  - name: a2a.tasks.AuthenticationInfo
    kind: struct
    fields:
      - name: scheme
        type: String
      - name: credentials
        type: Optional<String>
        presence: omitted_when_absent

  - name: a2a.tasks.TaskPushNotificationConfig
    kind: struct
    naming:
      summary: The wire form of a push-notification configuration (proto TaskPushNotificationConfig).
    fields:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: id
        type: Optional<a2a.tasks.PushNotificationConfigId>
        presence: omitted_when_absent
      - name: task_id
        type: Optional<a2a.tasks.TaskId>
        naming: {wire: taskId}
        presence: omitted_when_absent
      - name: url
        type: String
      - name: token
        type: Optional<String>
        presence: omitted_when_absent
      - name: authentication
        type: Optional<a2a.tasks.AuthenticationInfo>
        presence: omitted_when_absent

  - name: a2a.tasks.SendMessageConfiguration
    kind: struct
    fields:
      - name: accepted_output_modes
        type: Optional<List<String>>
        naming: {wire: acceptedOutputModes}
        presence: omitted_when_absent
      - name: task_push_notification_config
        type: Optional<a2a.tasks.TaskPushNotificationConfig>
        naming: {wire: taskPushNotificationConfig}
        presence: omitted_when_absent
      - name: history_length
        type: Optional<Integer>
        naming: {wire: historyLength}
        presence: omitted_when_absent
      - name: return_immediately
        type: Optional<Boolean>
        naming: {wire: returnImmediately}
        presence: omitted_when_absent

entities:
  - name: a2a.tasks.Task
    naming:
      summary: >-
        A stateful unit of work an agent runs for a client. Its lifecycle state is the wire
        `status.state`; the other status members are fields here.
    identity:
      name: id
      type: a2a.tasks.TaskId
    fields:
      - name: context_id
        type: a2a.tasks.ContextId
      # The tenant of the request that created the task; the wire Task carries none.
      - name: tenant
        type: Optional<String>
      - name: status_message
        type: Optional<a2a.tasks.Message>
      - name: status_timestamp
        type: Optional<Timestamp>
      - name: artifacts
        type: Optional<List<a2a.tasks.Artifact>>
      - name: history
        type: Optional<List<a2a.tasks.Message>>
      - name: metadata
        type: Optional<Json>
    relations:
      - name: push_notification_configs
        kind: owns
        target: a2a.tasks.PushNotificationConfig
        cardinality: many
        via: task_id
    # A2A v1.0.1 fixes which states are terminal (Completed, Failed, Canceled, Rejected) and
    # which are interrupted (InputRequired, AuthRequired), and no other edge. Resolved from
    # a2a.proto, enum TaskState:
    # - Submitted is entered once: "Indicates that a task has been successfully submitted and
    #   acknowledged." Acknowledging is not repeated, so no transition returns to it.
    # - The two interrupted states reach each other directly: InputRequired is "an interrupted
    #   state" and AuthRequired is "an interrupted state", and section 7.6.1 has the agent
    #   "transition the TaskState to TASK_STATE_AUTH_REQUIRED" whenever it needs authorization,
    #   naming no state it must leave first. Every non-terminal state other than the target is
    #   therefore a source of require_input and require_auth.
    lifecycle:
      initial: Submitted
      states: [Submitted, Working, InputRequired, AuthRequired, Completed, Failed, Canceled, Rejected]
      terminal: [Completed, Failed, Canceled, Rejected]
      transitions:
        - name: work
          from: [Submitted, InputRequired, AuthRequired]
          to: Working
        - name: require_input
          from: [Submitted, Working, AuthRequired]
          to: InputRequired
        - name: require_auth
          from: [Submitted, Working, InputRequired]
          to: AuthRequired
        - name: complete
          from: [Submitted, Working, InputRequired, AuthRequired]
          to: Completed
        - name: fail
          from: [Submitted, Working, InputRequired, AuthRequired]
          to: Failed
        - name: reject
          from: [Submitted, Working, InputRequired, AuthRequired]
          to: Rejected
        - name: cancel
          from: [Submitted, Working, InputRequired, AuthRequired]
          to: Canceled

  - name: a2a.tasks.PushNotificationConfig
    naming:
      summary: >-
        A webhook the agent posts task updates to. A2A v1.0.1 section 3.1.7: "The configuration
        MUST persist until task completion or explicit deletion"; it states no end of a
        configuration, so it lives until DeleteTaskPushNotificationConfig removes it.
    identity:
      name: row
      type: a2a.tasks.PushNotificationConfigRow
    # A configuration is scoped to its parent task: a2a.proto, Get and Delete requests,
    # task_id is "The parent task resource ID" and id is "The resource ID of the configuration",
    # and the REST path /tasks/{task_id}/pushNotificationConfigs/{id} nests it under the task.
    # Commands address it by the stored pair (task_id, config_id), never by config_id alone.
    # UNMAPPED (ESS gap): the natural identity is the struct (task_id, config_id). ESS 0.67.0
    # refuses both ways to create one: `instance: {task_id: input.task_id, id: input.id}` gives
    # "invalid type: map, expected a string", and a struct identity published by the creating
    # event gives SYNTH-001 "a struct held by reference has no member projection". So `row` is
    # an opaque ESS row identity (a2a.tasks.PushNotificationConfigRow) with no A2A source. It is
    # served nonetheless: in the event a2a.tasks.PushNotificationConfigCreated and the view
    # a2a.tasks.PushNotificationConfigs, where ESS refuses to drop it (UNMAPPED markers there).
    fields:
      - name: config_id
        type: a2a.tasks.PushNotificationConfigId
      - name: task_id
        type: a2a.tasks.TaskId
      - name: tenant
        type: Optional<String>
      - name: url
        type: String
      - name: token
        type: Optional<String>
      - name: authentication
        type: Optional<a2a.tasks.AuthenticationInfo>
    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]

actors:
  - name: a2a.tasks.Client
    naming:
      display: A2A client
      summary: An authenticated caller of the agent's A2A interface.
    may:
      - a2a.tasks.SendMessage
      - a2a.tasks.SendStreamingMessage
      - a2a.tasks.GetTask
      - a2a.tasks.CancelTask
      - a2a.tasks.SubscribeToTask
      - a2a.tasks.CreateTaskPushNotificationConfig
      - a2a.tasks.GetTaskPushNotificationConfig
      - a2a.tasks.ListTaskPushNotificationConfigs
      - a2a.tasks.DeleteTaskPushNotificationConfig
      # Section 13.1: List Tasks "MUST only return tasks visible to the authenticated client"; the read grant refuses other actors and anonymous callers.
      # UNMAPPED (ESS gap): the per-row boundary (which tasks and configurations this client may see); ESS 0.67.0 grants a whole view to an actor.
      - a2a.tasks.Tasks
      - a2a.tasks.TaskPushNotificationConfigs

  - name: a2a.tasks.Agent
    system: true
    naming:
      display: Agent
      summary: The agent moving its own tasks while it processes them.
    may:
      - a2a.tasks.StartWorking
      - a2a.tasks.RequireInput
      - a2a.tasks.RequireAuth
      - a2a.tasks.CompleteTask
      - a2a.tasks.FailTask
      - a2a.tasks.RejectTask
      - a2a.tasks.UpdateArtifact
      - a2a.tasks.AllTasks
      - a2a.tasks.PushNotificationConfigs

# Each A2A error carries its binding codes in its summary, from A2A v1.0.1 section 5.4, "Error
# Code Mappings": "All A2A-specific errors defined in Section 3.3.2 MUST be mapped to
# binding-specific error representations", and section 9.5: "Error Code: Mapped to `error.code`
# (numeric JSON-RPC error code)". The table row is quoted beside each error.
# UNMAPPED (ESS gap): the summary is the only place ESS 0.67.0 carries the code, and nothing
# reads it. An error declares only `name`, `naming`, `summary` and `fields`: `code: -32002` is
# refused, "unknown field `code`, expected one of `name`, `naming`, `summary`, `fields`", and
# `naming: {jsonrpc: -32002}` is refused, "unknown field `jsonrpc`, expected one of `wire`,
# `display`, `summary`, `code`" (`naming.code` is the identifier code emitters use). An error's
# `naming.wire` is a string the synthesized server writes as the error text, not JSON-RPC's
# numeric `error.code`. Missing construct: a numeric binding code per error, which a binding
# document and an authored error claim can read.
errors:
  # "| `TaskNotFoundError` | `-32001` | `NOT_FOUND` | `404 Not Found` |"
  - name: a2a.tasks.TaskNotFound
    summary: >-
      TaskNotFoundError (JSON-RPC -32001, gRPC NOT_FOUND, HTTP 404): the task, or the
      push-notification configuration, does not exist or is not accessible to the caller.
  # "| `TaskNotCancelableError` | `-32002` | `FAILED_PRECONDITION` | `400 Bad Request` |"
  - name: a2a.tasks.TaskNotCancelable
    summary: >-
      TaskNotCancelableError (JSON-RPC -32002, gRPC FAILED_PRECONDITION, HTTP 400): the task is
      not in a cancelable state.
  # "| `PushNotificationNotSupportedError` | `-32003` | `FAILED_PRECONDITION` | `400 Bad Request` |"
  - name: a2a.tasks.PushNotificationNotSupported
    summary: >-
      PushNotificationNotSupportedError (JSON-RPC -32003, gRPC FAILED_PRECONDITION, HTTP 400):
      the agent card does not declare capabilities.pushNotifications.
  # "| `UnsupportedOperationError` | `-32004` | `FAILED_PRECONDITION` | `400 Bad Request` |"
  - name: a2a.tasks.UnsupportedOperation
    summary: >-
      UnsupportedOperationError (JSON-RPC -32004, gRPC FAILED_PRECONDITION, HTTP 400): the
      operation, or an aspect of it, is not supported by this agent.
  # "| `ContentTypeNotSupportedError` | `-32005` | `INVALID_ARGUMENT` | `400 Bad Request` |"
  - name: a2a.tasks.ContentTypeNotSupported
    summary: >-
      ContentTypeNotSupportedError (JSON-RPC -32005, gRPC INVALID_ARGUMENT, HTTP 400): a media
      type of the message's parts is not supported by the agent.
  # "| `InvalidAgentResponseError` | `-32006` | `INTERNAL` | `500 Internal Server Error` |"
  # Section 3.3.2: "| `InvalidAgentResponseError` | An agent returned a response that does not
  # conform to the specification for the current method. |"
  - name: a2a.tasks.InvalidAgentResponse
    summary: >-
      InvalidAgentResponseError (JSON-RPC -32006, gRPC INTERNAL, HTTP 500): an agent returned a
      response that does not conform to the specification for the current method.
  # "| `ExtensionSupportRequiredError` | `-32008` | `FAILED_PRECONDITION` | `400 Bad Request` |"
  - name: a2a.tasks.ExtensionSupportRequired
    summary: >-
      ExtensionSupportRequiredError (JSON-RPC -32008, gRPC FAILED_PRECONDITION, HTTP 400): the
      agent card marks an extension required and the request does not declare it.
  # "| `VersionNotSupportedError` | `-32009` | `FAILED_PRECONDITION` | `400 Bad Request` |"
  - name: a2a.tasks.VersionNotSupported
    summary: >-
      VersionNotSupportedError (JSON-RPC -32009, gRPC FAILED_PRECONDITION, HTTP 400): the
      A2A-Version the request names is not supported by the agent.
  # A2A v1.0.1 section 3.4.3: "Agents MUST reject messages containing mismatching contextId and
  # taskId", and section 3.4.1: "If an agent cannot accept a client-provided contextId, it MUST
  # reject the request with an error". Neither names an A2A error, so both answer the error of
  # the category section 3.3.2 gives invalid input: "Validation Errors: Invalid input parameters
  # or message format … JSON-RPC -32602 Invalid params", gRPC INVALID_ARGUMENT, HTTP 400
  # (InvalidParamsError, section 9.5: "| `-32602` | `InvalidParamsError` | "Invalid parameters"
  # | The method parameters are invalid |").
  - name: a2a.tasks.ContextMismatch
    summary: >-
      InvalidParamsError (JSON-RPC -32602, gRPC INVALID_ARGUMENT, HTTP 400): the message's
      contextId differs from the contextId of the task it names.
  - name: a2a.tasks.ContextNotAccepted
    summary: >-
      InvalidParamsError (JSON-RPC -32602, gRPC INVALID_ARGUMENT, HTTP 400): the agent cannot
      accept the contextId the client provided.
  # Not an A2A error: A2A v1.0.1 names none for an agent that holds as much as it keeps. Section
  # 13.4: "Agents **SHOULD** implement rate limiting on all operations" and "Agents **SHOULD**
  # return appropriate error responses when rate limits are exceeded". Section 3.3.2 lists "rate
  # limit exceeded" among its system-error scenarios without a code of its own; the code chosen is
  # the one gRPC gives an exhausted quota.
  - name: a2a.tasks.ResourceExhausted
    summary: >-
      Not an A2A error (gRPC RESOURCE_EXHAUSTED, HTTP 429): the agent already holds as many tasks
      per tenant, messages per task history, or push-notification configurations per task as it
      keeps, so the request stored nothing.
  # Not an A2A wire error: the agent-side commands below are internal to the agent, and this is
  # what they answer from a state their transition does not leave.
  - name: a2a.tasks.TaskStateConflict
    summary: The task is not in a state this agent-side move starts from, so nothing moved.
    fields:
      - name: state
        type: a2a.tasks.Task.State

# Refusals the request alone decides answer before the task lookup. VersionNotSupportedError
# (section 3.6.2), ExtensionSupportRequiredError, PushNotificationNotSupportedError and, for
# streaming, UnsupportedOperationError (section 3.3.4) depend on the A2A-Version and
# A2A-Extensions service parameters and on the agent card, not on the task the request names.
# Upstream does not order them against TaskNotFoundError; we take the request-alone refusal
# first, so one request gets one answer across commands. A group cannot carry that order: its
# outcomes expand after the member's own, after the task lookup, and `before_row: true` in a
# group is refused, "unknown field `before_row`, expected one of `name`, `external`, `error`,
# `summary`, `refs`". So every command that reads a task row (GetTask, CancelTask,
# SubscribeToTask and the four push-notification commands) declares them itself, first, with
# `before_row: true`. The groups below serve SendMessage and SendStreamingMessage, whose task
# lookup is an external branch (message.taskId, UNMAPPED there), not a row read.
outcome_groups:
  - name: protocol-negotiation
    actor: a2a.tasks.Client
    except:
      - a2a.tasks.GetTask
      - a2a.tasks.CancelTask
      - a2a.tasks.SubscribeToTask
      - a2a.tasks.CreateTaskPushNotificationConfig
      - a2a.tasks.GetTaskPushNotificationConfig
      - a2a.tasks.ListTaskPushNotificationConfigs
      - a2a.tasks.DeleteTaskPushNotificationConfig
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        error: a2a.tasks.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        error: a2a.tasks.ExtensionSupportRequired

  - name: streaming-capability
    commands:
      - a2a.tasks.SendStreamingMessage
    outcomes:
      - name: streaming-not-supported
        external: the agent card does not declare capabilities.streaming
        error: a2a.tasks.UnsupportedOperation

# JSON-RPC method names. A2A v1.0.1 section 9.1: "Method Naming: PascalCase method names matching
# gRPC conventions (e.g., `SendMessage`, `GetTask`)", and the section 5.3 table gives each
# operation one name in both columns, e.g. "| Get task | `GetTask` | `GetTask` | `GET
# /tasks/{id}` |". The JSON-RPC method is the local name of the command it invokes
# (a2a.tasks.GetTask is `GetTask`), and each client command's summary states it; ListTasks is
# the view a2a.tasks.Tasks. `naming.wire` (`tasks:get`) is not the method: it is the segment ESS
# 0.67.0 routes a command under on its own command surface (`/tasks/commands/tasks:get` in
# generated/openapi) and the AsyncAPI address of the stream events. Section 9.3's
# `"method": "category/action"` is a placeholder that the method sections contradict (9.4.3
# `"method": "GetTask"`). The agent-side commands (StartWorking …) are not A2A methods.
commands:
  - name: a2a.tasks.SendMessage
    naming:
      wire: message:send
      display: Send message
      summary: >-
        Send a message to the agent, which answers with a task tracking its work or with a direct
        message (A2A v1.0.1 section 3.1.1; JSON-RPC SendMessage; POST /message:send).
    # Upstream contradicts itself on when SendMessage answers. Chosen: the proto, which section
    # 1.4 makes "the single authoritative normative definition of all protocol data objects and
    # request/response messages". a2a.proto, SendMessageConfiguration.return_immediately: "If
    # `true`, the operation returns immediately after creating the task, even if processing is
    # still in progress. If `false` (default), the operation MUST wait until the task reaches a
    # terminal (`COMPLETED`, `FAILED`, `CANCELED`, `REJECTED`) or interrupted
    # (`INPUT_REQUIRED`, `AUTH_REQUIRED`) state before returning." Section 3.2.2 agrees:
    # "Operations are blocking by default". Section 3.1.1 says the opposite and loses: "The
    # operation MUST return immediately with either task information or response message. Task
    # processing MAY continue asynchronously after the response when a Task is returned."
    # UNMAPPED (ESS gap): ESS 0.67.0 answers a command when its outcome commits. Missing
    # construct: an answer deferred until later commands (StartWorking, Complete, RequireInput,
    # …) move the created row into a named set of states. So `task-created` commits the task in
    # Submitted, and nothing checks that a blocking answer carries a terminal or interrupted
    # task.
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: message
        type: a2a.tasks.Message
      - name: configuration
        type: Optional<a2a.tasks.SendMessageConfiguration>
        presence: omitted_when_absent
      - name: metadata
        type: Optional<Json>
    response:
      - name: task
        type: Optional<a2a.tasks.TaskSnapshot>
        presence: omitted_when_absent
      - name: reply
        type: Optional<a2a.tasks.Message>
        naming: {wire: message}
        presence: omitted_when_absent
