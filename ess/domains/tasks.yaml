  - name: a2a.tasks.GetTask
    naming:
      wire: tasks:get
      display: Get task
      summary: >-
        Read a task's current state (A2A v1.0.1 section 3.1.3; JSON-RPC GetTask; GET
        /tasks/{id}).
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: id
        type: a2a.tasks.TaskId
      # UNMAPPED (ESS gap): a2a.proto, GetTaskRequest.history_length: "The server MUST NOT
      # return more messages than the provided value, but MAY apply a lower limit." Nothing
      # below bounds the returned `task.history` by it. Missing construct: a response list
      # bounded by an input (`task.history.count <= input.history_length`) that the response
      # observer checks.
      - name: history_length
        type: Optional<Integer>
        naming: {wire: historyLength}
        presence: omitted_when_absent
    response:
      - name: task
        type: a2a.tasks.TaskSnapshot
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        before_row: true
        error: a2a.tasks.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        before_row: true
        error: a2a.tasks.ExtensionSupportRequired
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      # A task answers only requests under the tenant it was created under, and a task created
      # without one only requests without one. Any other task is answered as an unknown id, so a
      # request learns nothing of another tenant's tasks (section 13.1: "Implementations MUST
      # scope results to the caller's authorized access boundaries").
      - name: other-tenant
        when_subject:
          predicate:
            any:
              - all: ["defined(tenant)", "defined(input.tenant)", tenant != input.tenant]
              - all: ["defined(tenant)", "not defined(input.tenant)"]
              - all: ["not defined(tenant)", "defined(input.tenant)"]
        error: a2a.tasks.TaskNotFound
      - name: found
        preserves: a2a.tasks.Task
        instance: id
        returns: true

  - name: a2a.tasks.CancelTask
    naming:
      wire: tasks:cancel
      display: Cancel task
      summary: >-
        Ask the agent to cancel a task (A2A v1.0.1 section 3.1.5; JSON-RPC CancelTask; POST
        /tasks/{id}:cancel).
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: id
        type: a2a.tasks.TaskId
      - name: metadata
        type: Optional<Json>
    response:
      - name: task
        type: a2a.tasks.TaskSnapshot
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        before_row: true
        error: a2a.tasks.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        before_row: true
        error: a2a.tasks.ExtensionSupportRequired
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      # A task of another tenant answers as an unknown id, as GetTask `other-tenant` says.
      - name: other-tenant
        when_subject:
          predicate:
            any:
              - all: ["defined(tenant)", "defined(input.tenant)", tenant != input.tenant]
              - all: ["defined(tenant)", "not defined(input.tenant)"]
              - all: ["not defined(tenant)", "defined(input.tenant)"]
        error: a2a.tasks.TaskNotFound
      - name: not-cancelable-now
        external: the agent cannot cancel the task at its current stage
        error: a2a.tasks.TaskNotCancelable
      - name: canceled
        moves: a2a.tasks.Task.cancel
        instance: id
        sets:
          status_message: {generated: true}
          status_timestamp: {generated: true}
        emits: [a2a.tasks.TaskStatusUpdated]
        payload:
          a2a.tasks.TaskStatusUpdated:
            task_id: input.id
            context_id: {subject: context_id}
            status:
              state: TASK_STATE_CANCELED
              message: {generated: true}
              timestamp: {generated: true}
        returns: true
      # Upstream contradicts itself on a second cancel. Chosen: section 3.1.5, the section this
      # command cites, whose errors include "TaskNotCancelableError: The task is not in a
      # cancelable state (e.g., already completed, failed, or canceled)." So a task already in
      # Canceled answers TaskNotCancelable. The other reading, section 3.3.1: "Cancel Task
      # operations are idempotent - multiple cancellation requests have the same effect."
      - name: not-cancelable
        wrong_state: true
        error: a2a.tasks.TaskNotCancelable
        summary: The task is in a terminal state, Canceled included.

  - name: a2a.tasks.SubscribeToTask
    naming:
      wire: tasks:subscribe
      display: Subscribe to task
      summary: >-
        Open a stream of a task's updates, starting with the task itself (A2A v1.0.1 section
        3.1.6; JSON-RPC SubscribeToTask; GET /tasks/{id}:subscribe).
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: id
        type: a2a.tasks.TaskId
    response:
      - name: task
        type: a2a.tasks.TaskSnapshot
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        before_row: true
        error: a2a.tasks.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        before_row: true
        error: a2a.tasks.ExtensionSupportRequired
      - name: streaming-not-supported
        external: the agent card does not declare capabilities.streaming
        before_row: true
        error: a2a.tasks.UnsupportedOperation
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      # A task of another tenant answers as an unknown id, as GetTask `other-tenant` says.
      - name: other-tenant
        when_subject:
          predicate:
            any:
              - all: ["defined(tenant)", "defined(input.tenant)", tenant != input.tenant]
              - all: ["defined(tenant)", "not defined(input.tenant)"]
              - all: ["not defined(tenant)", "defined(input.tenant)"]
        error: a2a.tasks.TaskNotFound
      - name: task-terminal
        when_subject:
          predicate:
            state: [Completed, Failed, Canceled, Rejected]
        error: a2a.tasks.UnsupportedOperation
      # The answer `task` is the first element of the stream. Section 3.1.6: "The operation MUST
      # return a `Task` object as the first event in the stream, representing the current state
      # of the task at the time of subscription."
      # UNMAPPED (ESS gap): nothing emits a2a.tasks.TaskSubscriptionResponse. Subscribing changes
      # no task, and a preserving outcome that emits is refused: "ESS-COMMAND-004: a preserving
      # outcome declares no assignment, event or error". `updates:` is accepted but projects
      # "changes a `a2a.tasks.Task` without moving it", which subscribing does not. Missing
      # construct: an outcome that reads its subject unchanged and emits an event.
      - name: subscribed
        preserves: a2a.tasks.Task
        instance: id
        returns: true

  - name: a2a.tasks.CreateTaskPushNotificationConfig
    naming:
      wire: pushNotificationConfigs:create
      display: Create push notification config
      summary: >-
        Register a webhook for a task's updates (A2A v1.0.1 section 3.1.7; JSON-RPC
        CreateTaskPushNotificationConfig; POST /tasks/{task_id}/pushNotificationConfigs).
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: id
        type: Optional<a2a.tasks.PushNotificationConfigId>
        presence: omitted_when_absent
      - name: task_id
        type: a2a.tasks.TaskId
        naming: {wire: taskId}
      - name: url
        type: String
      - name: token
        type: Optional<String>
        presence: omitted_when_absent
      - name: authentication
        type: Optional<a2a.tasks.AuthenticationInfo>
        presence: omitted_when_absent
    response:
      - name: config
        type: a2a.tasks.TaskPushNotificationConfig
    # A task in a terminal state is not refused: section 3.1.7 lists exactly two errors,
    # PushNotificationNotSupportedError and TaskNotFoundError ("The task ID does not exist or is
    # not accessible").
    # UNMAPPED: A2A v1.0.1 is silent on a second create with an `id` a configuration of the
    # same task already carries; `created` then adds a second row with that pair.
    # The same `id` under another task is a distinct configuration (parent-scoped, see
    # PushNotificationConfig).
    # UNMAPPED (ESS gap): `assigned` writes `row` and `config_id` as two independent
    # `{generated: true}` values; ESS 0.67.0 has no construct to generate the id once and reuse
    # it in the stored field and the event payload, so nothing checks they agree.
    # The three request-alone refusals come first (rule above outcome_groups). Declared after
    # `created` they would also be shadowed: `created` (`when: defined(id)`) answers before an
    # external branch declared after it, and jsonrpc-create-task-push-notification-config was
    # refused, "ESS-AUTHOR-041: … `created` (defined(id)) answers it first, so
    # `push-not-supported` is not taken". Section 3.3.4: "operations related to push
    # notification configuration (Create, Get, List, Delete) MUST return
    # PushNotificationNotSupportedError".
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        before_row: true
        error: a2a.tasks.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        before_row: true
        error: a2a.tasks.ExtensionSupportRequired
      - name: push-not-supported
        external: the agent card does not declare capabilities.pushNotifications
        before_row: true
        error: a2a.tasks.PushNotificationNotSupported
      - name: task-not-found
        when_related:
          via: input.task_id
          exists: false
        error: a2a.tasks.TaskNotFound
      # UNMAPPED (ESS gap): a task of another tenant, or of one when the request has none (and
      # the reverse), answers TaskNotFound, as GetTask `other-tenant` says. The same guard as
      # `when_related: {via: input.task_id, predicate: …}` validates on ESS 0.67.0, but synthesis
      # refuses its scenario, "ESS-SYNTH-003: … no candidate of the 4 tried satisfies `a related
      # row on which …`", and then finds no configuration rows to arrange for
      # GetTaskPushNotificationConfig `found` and DeleteTaskPushNotificationConfig `deleted`
      # (ESS-SYNTH-001). Missing construct: a related-row guard comparing a stored Optional with
      # an input Optional that synthesis can witness.
      # The agent's own bound (section 13.4, see ResourceExhausted), declared before `created` so
      # that it is taken. The bound is the server's (`--max-push-configs`), so the branch is
      # external.
      - name: config-limit
        external: >-
          the task already holds as many push-notification configurations as the agent keeps,
          and the request adds one rather than replacing one of the same id
        error: a2a.tasks.ResourceExhausted
      - name: created
        when: defined(id)
        creates: a2a.tasks.PushNotificationConfig
        instance: row
        sets:
          config_id: input.id
          task_id: input.task_id
          tenant: input.tenant
          url: input.url
          token: input.token
          authentication: input.authentication
        emits: [a2a.tasks.PushNotificationConfigCreated]
        payload:
          a2a.tasks.PushNotificationConfigCreated:
            row: {generated: true}
            config_id: input.id
            task_id: input.task_id
        returns: true
      - name: assigned
        creates: a2a.tasks.PushNotificationConfig
        instance: row
        sets:
          config_id: {generated: true}
          task_id: input.task_id
          tenant: input.tenant
          url: input.url
          token: input.token
          authentication: input.authentication
        emits: [a2a.tasks.PushNotificationConfigCreated]
        payload:
          a2a.tasks.PushNotificationConfigCreated:
            row: {generated: true}
            config_id: {generated: true}
            task_id: input.task_id
        returns: true

  - name: a2a.tasks.GetTaskPushNotificationConfig
    naming:
      wire: pushNotificationConfigs:get
      display: Get push notification config
      summary: >-
        Read one push-notification configuration (A2A v1.0.1 section 3.1.8; JSON-RPC
        GetTaskPushNotificationConfig; GET /tasks/{task_id}/pushNotificationConfigs/{id}).
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: task_id
        type: a2a.tasks.TaskId
        naming: {wire: taskId}
      - name: id
        type: a2a.tasks.PushNotificationConfigId
    response:
      - name: config
        type: a2a.tasks.TaskPushNotificationConfig
    # The three request-alone refusals come first (rule above outcome_groups). After the
    # config-not-found row-set guard synthesis refuses them, "ESS-SYNTH-001: … `config-not-found`
    # is not decidedly passed over: its row set is True".
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        before_row: true
        error: a2a.tasks.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        before_row: true
        error: a2a.tasks.ExtensionSupportRequired
      - name: push-not-supported
        external: the agent card does not declare capabilities.pushNotifications
        before_row: true
        error: a2a.tasks.PushNotificationNotSupported
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      # A configuration answers only requests under the tenant it was created under, which is its
      # task's (CreateTaskPushNotificationConfig `other-tenant`), and one created without a tenant
      # only requests without one. Any other is answered as an unknown id (section 13.1).
      # UNMAPPED (ESS gap): the rule is on the configuration's tenant, not the task's. ESS 0.67.0
      # refuses a `when_subject:` guard beside this row-set guard: "ESS-COMMAND-009:
      # `a2a.tasks.GetTaskPushNotificationConfig` selects on a row set (`when_related: {entity,
      # where, …}`) and on a `when_subject` guard; one command reads one kind of related row in
      # this cut".
      - name: config-not-found
        when_related:
          entity: a2a.tasks.PushNotificationConfig
          where: {all: [task_id == input.task_id, config_id == input.id]}
          exists: false
        error: a2a.tasks.TaskNotFound
      # UNMAPPED (ESS gap): the `config` answered is not bound to the matched row; a typed response is opaque to ESS 0.67.0, as on ListTaskPushNotificationConfigs.
      - name: found
        preserves: a2a.tasks.Task
        instance: task_id
        returns: true

  - name: a2a.tasks.ListTaskPushNotificationConfigs
    naming:
      wire: pushNotificationConfigs:list
      display: List push notification configs
      summary: >-
        Read every active push-notification configuration of a task (A2A v1.0.1 section 3.1.9;
        JSON-RPC ListTaskPushNotificationConfigs; GET /tasks/{task_id}/pushNotificationConfigs).
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: task_id
        type: a2a.tasks.TaskId
        naming: {wire: taskId}
      - name: page_size
        type: Optional<Integer>
        naming: {wire: pageSize}
        presence: omitted_when_absent
      - name: page_token
        type: Optional<String>
        naming: {wire: pageToken}
        presence: omitted_when_absent
    response:
      - name: configs
        type: Optional<List<a2a.tasks.TaskPushNotificationConfig>>
        presence: omitted_when_absent
      - name: next_page_token
        type: Optional<String>
        naming: {wire: nextPageToken}
        presence: omitted_when_absent
    # Both fields are Optional: a2a.proto ListTaskPushNotificationConfigsResponse declares
    # `repeated TaskPushNotificationConfig configs = 1;` and `string next_page_token = 2;` with
    # no REQUIRED behavior, and ProtoJSON omits an empty list and an empty string (section 5.7).
    # UNMAPPED (ESS gap): which rows `configs` holds. Section 3.1.9: "The operation MUST return
    # all active push notification configurations for the specified task and MAY support
    # pagination". A typed response is opaque to ESS 0.67.0: no construct fills a response list
    # from the rows a view selects, so the rows are observable only through the view
    # a2a.tasks.TaskPushNotificationConfigs.
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        before_row: true
        error: a2a.tasks.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        before_row: true
        error: a2a.tasks.ExtensionSupportRequired
      - name: push-not-supported
        external: the agent card does not declare capabilities.pushNotifications
        before_row: true
        error: a2a.tasks.PushNotificationNotSupported
      - name: task-not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      # A task of another tenant answers as an unknown id, as GetTask `other-tenant` says.
      - name: other-tenant
        when_subject:
          predicate:
            any:
              - all: ["defined(tenant)", "defined(input.tenant)", tenant != input.tenant]
              - all: ["defined(tenant)", "not defined(input.tenant)"]
              - all: ["not defined(tenant)", "defined(input.tenant)"]
        error: a2a.tasks.TaskNotFound
      - name: listed
        preserves: a2a.tasks.Task
        instance: task_id
        returns: true

  - name: a2a.tasks.DeleteTaskPushNotificationConfig
    naming:
      wire: pushNotificationConfigs:delete
      display: Delete push notification config
      summary: >-
        Remove a push-notification configuration; deleting it again has the same effect (A2A
        v1.0.1 section 3.1.10; JSON-RPC DeleteTaskPushNotificationConfig; DELETE
        /tasks/{task_id}/pushNotificationConfigs/{id}).
    input:
      - name: tenant
        type: Optional<String>
        presence: omitted_when_absent
      - name: task_id
        type: a2a.tasks.TaskId
        naming: {wire: taskId}
      - name: id
        type: a2a.tasks.PushNotificationConfigId
    # Section 3.1.10 answers TaskNotFoundError when "The task ID does not exist or is not
    # accessible": `task-not-found` addresses the parent task through input.task_id. Under an
    # existing task, `deleted` removes the configuration with that task_id and config_id, if
    # any. A second delete, or an id the task does not carry (including one another task
    # carries), removes nothing and answers the same: section 3.1.10 "This operation MUST be
    # idempotent - multiple deletions of the same config have the same effect." That no-op
    # delete still emits a2a.tasks.PushNotificationConfigDeleted, though no configuration went.
    outcomes:
      - name: version-not-supported
        external: the A2A-Version service parameter names a version the agent does not support
        before_row: true
        error: a2a.tasks.VersionNotSupported
      - name: extension-required
        external: the agent card marks an extension required and the request does not declare it
        before_row: true
        error: a2a.tasks.ExtensionSupportRequired
      - name: push-not-supported
        external: the agent card does not declare capabilities.pushNotifications
        before_row: true
        error: a2a.tasks.PushNotificationNotSupported
      - name: task-not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      # UNMAPPED (ESS gap): a task of another tenant, or of one when the request has none (and
      # the reverse), answers TaskNotFound, as GetTask `other-tenant` says. The same
      # `when_subject:` guard here validates and synthesizes on ESS 0.67.0, but the synthesized
      # `deleted` scenario arranges its selected rows under a task it created with tenant
      # "tenant-1" and deletes there with input tenant "tenant", so the interpreted target answers
      # `other-tenant` and the scenario fails, "expected outcome = deleted, observed outcome =
      # other-tenant". Missing: synthesis that arranges an `affects:` branch past a
      # `when_subject:` refusal declared before it.
      # UNMAPPED: (ESS gap) a no-op delete emits PushNotificationConfigDeleted; a separate no-op branch (when_related exists: false) is refused, ESS-SYNTH-001 "a step of the scenario changes rows of the selector's entity in a way synthesis does not follow".
      - name: deleted
        updates: a2a.tasks.Task
        instance: task_id
        affects:
          - entity: a2a.tasks.PushNotificationConfig
            where: {all: [task_id == subject.id, config_id == input.id]}
            deletes: a2a.tasks.PushNotificationConfig
        emits: [a2a.tasks.PushNotificationConfigDeleted]
        payload:
          a2a.tasks.PushNotificationConfigDeleted:
            config_id: input.id
            task_id: input.task_id

  - name: a2a.tasks.StartWorking
    naming:
      wire: tasks:work
      display: Start working
      summary: The agent works on the task (TASK_STATE_WORKING).
    input:
      - name: id
        type: a2a.tasks.TaskId
      - name: status_message
        type: Optional<a2a.tasks.Message>
    outcomes:
      - name: moved
        moves: a2a.tasks.Task.work
        instance: id
        sets:
          status_message: input.status_message
          status_timestamp: {generated: true}
        emits: [a2a.tasks.TaskStatusUpdated]
        payload:
          a2a.tasks.TaskStatusUpdated:
            task_id: input.id
            context_id: {subject: context_id}
            status:
              state: TASK_STATE_WORKING
              message: input.status_message
              timestamp: {generated: true}
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      - name: wrong-state
        wrong_state: true
        error: a2a.tasks.TaskStateConflict

  - name: a2a.tasks.RequireInput
    naming:
      wire: tasks:require_input
      display: Require input
      summary: The agent needs more input from the client (TASK_STATE_INPUT_REQUIRED, section 3.4.3).
    input:
      - name: id
        type: a2a.tasks.TaskId
      - name: status_message
        type: Optional<a2a.tasks.Message>
    outcomes:
      - name: moved
        moves: a2a.tasks.Task.require_input
        instance: id
        sets:
          status_message: input.status_message
          status_timestamp: {generated: true}
        emits: [a2a.tasks.TaskStatusUpdated]
        payload:
          a2a.tasks.TaskStatusUpdated:
            task_id: input.id
            context_id: {subject: context_id}
            status:
              state: TASK_STATE_INPUT_REQUIRED
              message: input.status_message
              timestamp: {generated: true}
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      - name: wrong-state
        wrong_state: true
        error: a2a.tasks.TaskStateConflict

  - name: a2a.tasks.RequireAuth
    naming:
      wire: tasks:require_auth
      display: Require authorization
      summary: The agent needs the client to authorize (TASK_STATE_AUTH_REQUIRED, section 7.6).
    input:
      - name: id
        type: a2a.tasks.TaskId
      - name: status_message
        type: Optional<a2a.tasks.Message>
    outcomes:
      # UNMAPPED (ESS gap): section 7.6.1, the agent "MUST include a TaskStatus message
      # explaining the required authorization, unless the details of the authorization have
      # been negotiated out-of-band or via an extension". ESS 0.67.0 validates a refusal
      # `when: not defined(status_message)` beside `external:` (the negotiation), but this is a
      # system command, awaited and not sent, and the interpreted target leaves the scenario
      # unsupported: "ESS-CF-TARGET: cannot expose awaiting a2a.tasks.RequireAuth on an
      # instance: the system may reach any of a2a.tasks.RequireAuth/message-required,
      # a2a.tasks.RequireAuth/moved depending on the input it decides, and the interpreter does
      # not choose". Missing construct: a system command's refusal decided by its own input.
      - name: moved
        moves: a2a.tasks.Task.require_auth
        instance: id
        sets:
          status_message: input.status_message
          status_timestamp: {generated: true}
        emits: [a2a.tasks.TaskStatusUpdated]
        payload:
          a2a.tasks.TaskStatusUpdated:
            task_id: input.id
            context_id: {subject: context_id}
            status:
              state: TASK_STATE_AUTH_REQUIRED
              message: input.status_message
              timestamp: {generated: true}
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      - name: wrong-state
        wrong_state: true
        error: a2a.tasks.TaskStateConflict

  - name: a2a.tasks.CompleteTask
    naming:
      wire: tasks:complete
      display: Complete task
      summary: The task finished successfully (TASK_STATE_COMPLETED).
    input:
      - name: id
        type: a2a.tasks.TaskId
      - name: status_message
        type: Optional<a2a.tasks.Message>
    outcomes:
      - name: moved
        moves: a2a.tasks.Task.complete
        instance: id
        sets:
          status_message: input.status_message
          status_timestamp: {generated: true}
        emits: [a2a.tasks.TaskStatusUpdated]
        payload:
          a2a.tasks.TaskStatusUpdated:
            task_id: input.id
            context_id: {subject: context_id}
            status:
              state: TASK_STATE_COMPLETED
              message: input.status_message
              timestamp: {generated: true}
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      - name: wrong-state
        wrong_state: true
        error: a2a.tasks.TaskStateConflict

  - name: a2a.tasks.FailTask
    naming:
      wire: tasks:fail
      display: Fail task
      summary: The task finished with an error (TASK_STATE_FAILED).
    input:
      - name: id
        type: a2a.tasks.TaskId
      - name: status_message
        type: Optional<a2a.tasks.Message>
    outcomes:
      - name: moved
        moves: a2a.tasks.Task.fail
        instance: id
        sets:
          status_message: input.status_message
          status_timestamp: {generated: true}
        emits: [a2a.tasks.TaskStatusUpdated]
        payload:
          a2a.tasks.TaskStatusUpdated:
            task_id: input.id
            context_id: {subject: context_id}
            status:
              state: TASK_STATE_FAILED
              message: input.status_message
              timestamp: {generated: true}
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      - name: wrong-state
        wrong_state: true
        error: a2a.tasks.TaskStateConflict

  - name: a2a.tasks.RejectTask
    naming:
      wire: tasks:reject
      display: Reject task
      summary: The agent declines the task (TASK_STATE_REJECTED).
    input:
      - name: id
        type: a2a.tasks.TaskId
      - name: status_message
        type: Optional<a2a.tasks.Message>
    outcomes:
      - name: moved
        moves: a2a.tasks.Task.reject
        instance: id
        sets:
          status_message: input.status_message
          status_timestamp: {generated: true}
        emits: [a2a.tasks.TaskStatusUpdated]
        payload:
          a2a.tasks.TaskStatusUpdated:
            task_id: input.id
            context_id: {subject: context_id}
            status:
              state: TASK_STATE_REJECTED
              message: input.status_message
              timestamp: {generated: true}
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      - name: wrong-state
        wrong_state: true
        error: a2a.tasks.TaskStateConflict

  # Section 3.7: "Results SHOULD BE returned using Artifacts associated with a Task", and
  # a2a.proto names the delta TaskArtifactUpdateEvent: "A task delta where an artifact has been
  # generated."
  - name: a2a.tasks.UpdateArtifact
    naming:
      wire: tasks:update_artifact
      display: Update artifact
      summary: The agent generates an artifact of the task, or a chunk of one (TaskArtifactUpdateEvent).
    input:
      - name: id
        type: a2a.tasks.TaskId
      - name: artifact
        type: a2a.tasks.Artifact
      - name: append
        type: Boolean
      - name: last_chunk
        type: Boolean
    outcomes:
      - name: not-found
        unknown_instance: true
        error: a2a.tasks.TaskNotFound
      # UNMAPPED (ESS gap): the task's stored `artifacts` should gain `input.artifact`, or, with
      # `append`, the parts of the artifact with the same artifact_id should grow (a2a.proto,
      # TaskArtifactUpdateEvent.append: "the content of this artifact should be appended to a
      # previously sent artifact with the same ID"). ESS 0.67.0 has no list-append source in
      # `sets:`; `{expr: "coalesce(subject.artifacts, []) + [input.artifact]"}` is refused with
      # ESS-SPEC-012 "`[` is no part of an expression". Missing construct: append to, or
      # replace by key in, a stored list. The task's `history` has the same gap.
      - name: updated
        updates: a2a.tasks.Task
        instance: id
        emits: [a2a.tasks.TaskArtifactUpdated]
        payload:
          a2a.tasks.TaskArtifactUpdated:
            task_id: input.id
            context_id: {subject: context_id}
            artifact: input.artifact
            append: input.append
            last_chunk: input.last_chunk

events:
  - name: a2a.tasks.TaskCreated
    fields:
      - name: task_id
        type: a2a.tasks.TaskId

  - name: a2a.tasks.TaskStatusUpdated
    naming:
      summary: >-
        Emitted on every lifecycle move; streamed and pushed as TaskStatusUpdateEvent, whose
        task_id, context_id and status a2a.proto marks REQUIRED.
    fields:
      - name: task_id
        type: a2a.tasks.TaskId
      - name: context_id
        type: a2a.tasks.ContextId
      - name: status
        type: a2a.tasks.TaskStatus

  - name: a2a.tasks.TaskArtifactUpdated
    naming:
      summary: >-
        An artifact the agent generated; streamed and pushed as the a2a.proto message
        TaskArtifactUpdateEvent, whose task_id, context_id and artifact it marks REQUIRED.
    # a2a.proto TaskArtifactUpdateEvent declares `bool append = 4;` and `bool last_chunk = 5;`
    # without REQUIRED, so both are Optional (section 5.7). Wire names are the ProtoJSON camelCase
    # names (section 5.5): taskId, contextId, lastChunk.
    fields:
      - name: task_id
        type: a2a.tasks.TaskId
        naming: {wire: taskId}
      - name: context_id
        type: a2a.tasks.ContextId
        naming: {wire: contextId}
      - name: artifact
        type: a2a.tasks.Artifact
      - name: append
        type: Optional<Boolean>
      - name: last_chunk
        type: Optional<Boolean>
        naming: {wire: lastChunk}

  # The two streams. a2a.proto answers SendStreamingMessage and SubscribeToTask each with
  # `stream StreamResponse`, "A wrapper object used in streaming operations to encapsulate
  # different types of response data", whose `oneof payload` is task, message, status_update or
  # artifact_update. Section 11.7: "REST streaming uses Server-Sent Events with the `data` field
  # containing JSON serializations of the protocol data objects", one `data: { /* StreamResponse
  # object */ }` per element. Each stream is one event here, so each gets its own channel; the
  # channel address is the wire name of the command that opens the stream.
  # The four members are Optional, as in a2a.discovery.SecurityScheme: ProtoJSON writes the
  # chosen member inline under its own name (section 6.2: `data: {"task": …}`,
  # `{"artifactUpdate": {"taskId": …}}`, `{"statusUpdate": …}`).
  # UNMAPPED (ESS gap): the exactly-one rule of the oneof. ESS 0.67.0 has no externally tagged
  # union (a union without `tag:` is refused: "missing field `tag`"), and an emitting outcome must
  # source every member, the absent ones included: leaving `message` out of the payload is
  # refused, "ESS-COMMAND-005: emitted payload field has no source; declare a mapping or
  # {generated: true} ownership", and `message: {cleared: true}` is refused, "ESS-COMMAND-001:
  # `message` is filled `{cleared: true}`, which says a field holds nothing — an entity's field,
  # not an event's". So the members a stream element leaves out are `{generated: true}` below.
  # Missing constructs: a union keyed by member name, and an absent source for an Optional event
  # field.
  # UNMAPPED (ESS gap): the elements after the first. Section 3.1.2 follows the first Task with
  # "zero or more TaskStatusUpdateEvent or TaskArtifactUpdateEvent objects", and section 3.5.2:
  # "Events MUST be broadcast to all active streams for that task" and "Each stream MUST receive
  # the same events in the same order". Those are a2a.tasks.TaskStatusUpdated and
  # a2a.tasks.TaskArtifactUpdated, which the agent moves and UpdateArtifact emit. ESS 0.67.0
  # emits an event from the outcome that causes it; it has no construct that delivers one onto
  # the streams other commands opened for the same task and closes those streams when the task
  # reaches a terminal state. Having every agent move also emit a stream element would assert one
  # where no stream is open. Missing construct: a response stream a command opens, keyed by a
  # row, that later events of that row are delivered on until a lifecycle state ends it.
  - name: a2a.tasks.MessageStreamResponse
    naming:
      wire: message:stream
      display: Message stream response
      summary: >-
        One element of the stream SendStreamingMessage answers with (proto StreamResponse;
        A2A v1.0.1 sections 3.1.2 and 3.2.3).
    fields:
      - name: task
        type: Optional<a2a.tasks.TaskSnapshot>
        presence: omitted_when_absent
      - name: message
        type: Optional<a2a.tasks.Message>
        presence: omitted_when_absent
      - name: status_update
        type: Optional<a2a.tasks.TaskStatusUpdateEvent>
        naming: {wire: statusUpdate}
        presence: omitted_when_absent
      - name: artifact_update
        type: Optional<a2a.tasks.TaskArtifactUpdateEvent>
        naming: {wire: artifactUpdate}
        presence: omitted_when_absent

  - name: a2a.tasks.TaskSubscriptionResponse
    naming:
      wire: tasks:subscribe
      display: Task subscription response
      summary: >-
        One element of the stream SubscribeToTask answers with (proto StreamResponse;
        A2A v1.0.1 sections 3.1.6 and 3.2.3).
    fields:
      - name: task
        type: Optional<a2a.tasks.TaskSnapshot>
        presence: omitted_when_absent
      - name: message
        type: Optional<a2a.tasks.Message>
        presence: omitted_when_absent
      - name: status_update
        type: Optional<a2a.tasks.TaskStatusUpdateEvent>
        naming: {wire: statusUpdate}
        presence: omitted_when_absent
      - name: artifact_update
        type: Optional<a2a.tasks.TaskArtifactUpdateEvent>
        naming: {wire: artifactUpdate}
        presence: omitted_when_absent

  - name: a2a.tasks.PushNotificationConfigCreated
    fields:
      # UNMAPPED (ESS gap): `row` has no A2A source; dropping it is refused, ESS-COMMAND-001 "acts on the instance named by `row`, which is no field of an emitted event of it".
      - name: row
        type: a2a.tasks.PushNotificationConfigRow
      - name: config_id
        type: a2a.tasks.PushNotificationConfigId
      - name: task_id
        type: a2a.tasks.TaskId

  - name: a2a.tasks.PushNotificationConfigDeleted
    fields:
      - name: config_id
        type: a2a.tasks.PushNotificationConfigId
      - name: task_id
        type: a2a.tasks.TaskId

views:
  # ListTasks (A2A v1.0.1 section 3.1.4, a2a.proto ListTasksRequest): the optional filters
  # context_id ("Filter tasks by context ID …"), status ("Filter tasks by their current status
  # state") and status_timestamp_after ("Only tasks with a status timestamp time greater than or
  # equal to this value will be returned").
  # UNMAPPED (ESS gap): "Implementations MUST return tasks sorted by their status timestamp
  # time in descending order". `order_by: [status_timestamp desc]` validates, but synthesis
  # then refuses every outcome that writes a task: "ESS-SYNTH-014: … a2a.tasks.Tasks declares
  # an order and this scenario can put 1 row(s) in it: comparing two rows needs two
  # a2a.tasks.Tasks, and no declared move reaches it from Submitted". Missing construct: an
  # order synthesis checks over rows that several creating sends arrange.
  # UNMAPPED (ESS gap): the cursor paging (page_size, page_token, next_page_token, "MUST use
  # cursor-based pagination"). ESS 0.67.0 `paging:` is by offset (`page * size`) and answers
  # no continuation token. Missing construct: cursor paging. Also unchecked: include_artifacts
  # ("the artifacts field MUST be omitted entirely") and history_length, which shape each row;
  # missing construct: a view field omitted by a parameter.
  # JSON-RPC method `ListTasks` (section 5.3: "| List tasks | `ListTasks` | `ListTasks` | `GET
  # /tasks` |"; section 9.4.4 `"method": "ListTasks"`), held by the authored scenario
  # jsonrpc-list-tasks. Section 3.1.4, Errors: "None specific to this operation beyond standard
  # protocol errors."
  # UNMAPPED (ESS gap): a view answers no error, so the protocol-negotiation refusals
  # (VersionNotSupportedError -32009, ExtensionSupportRequiredError -32008; section 3.6.2 "agents
  # MUST return a VersionNotSupportedError") are not declared for ListTasks. `errors:` on a view
  # is refused: "unknown field `errors`, expected one of `name`, `source`, `shape`, `fields`,
  # `params`, `filter`, `group_by`, `order_by`, `paging`, `absent`, `consistency`, `naming`".
  # Missing construct: a refusal a view read answers before it reads any row.
  - name: a2a.tasks.Tasks
    source: a2a.tasks.Task
    consistency: read_your_writes
    params:
      - name: context_id
        type: Optional<a2a.tasks.ContextId>
        wire: contextId
      # UNMAPPED (ESS gap): wire type is TaskState (TASK_STATE_*); ESS 0.67.0 has no map from it to the lifecycle states the filter compares.
      - name: status
        type: Optional<a2a.tasks.Task.State>
      - name: status_timestamp_after
        type: Optional<Timestamp>
        wire: statusTimestampAfter
      # The tenant of the request: a2a.proto ListTasksRequest.tenant, and the `{tenant}` of the
      # route. A task is listed only under the tenant it was created under, and a task created
      # without one only without one (section 13.1).
      - name: tenant
        type: Optional<String>
    filter:
      all:
        - any: ["not defined(param.context_id)", context_id == param.context_id]
        - any: ["not defined(param.status)", state == param.status]
        - any: ["not defined(param.status_timestamp_after)", status_timestamp >= param.status_timestamp_after]
        - any:
            - all: ["defined(param.tenant)", "defined(tenant)", tenant == param.tenant]
            - all: ["not defined(param.tenant)", "not defined(tenant)"]
    naming:
      wire: tasks
      display: List tasks
      summary: >-
        The tasks visible to the client, filtered by context, state and status time (A2A v1.0.1
        section 3.1.4; JSON-RPC ListTasks).
    fields:
      - name: id
        type: a2a.tasks.TaskId
      - name: context_id
        type: a2a.tasks.ContextId
        wire: contextId
      # UNMAPPED (ESS gap): the wire spells the state TASK_STATE_*. ESS 0.67.0 gives a lifecycle
      # state no wire spelling: `states: [{name: Submitted, wire: TASK_STATE_SUBMITTED}, …]` is
      # refused "invalid type: map, expected a string", so the row carries the lifecycle name.
      - name: state
        type: a2a.tasks.Task.State
      - name: status_message
        type: Optional<a2a.tasks.Message>
        wire: statusMessage
      - name: status_timestamp
        type: Optional<Timestamp>
        wire: statusTimestamp
      - name: artifacts
        type: Optional<List<a2a.tasks.Artifact>>
      - name: history
        type: Optional<List<a2a.tasks.Message>>
      - name: metadata
        type: Optional<Json>

  # Not an A2A operation and no A2A source: every task with its identity and state, so a
  # conformance run can observe a task by identity (a parameterized view is no identity view to
  # ESS). Kept because removing it makes synthesis refuse 35 outcomes of this unit's commands.
  # Scoped per section 13.1 ("Implementations MUST scope results to the caller's authorized
  # access boundaries") by a read grant: only the system actor a2a.tasks.Agent names it in
  # `may:`, so a2a.tasks.Client and an anonymous caller are refused "not granted" before any row
  # is read. UNMAPPED (ESS gap): the per-row boundary within the Agent's reads (which tasks one
  # authenticated caller may see); ESS 0.67.0 grants a whole view to an actor, no subset of rows.
  - name: a2a.tasks.AllTasks
    source: a2a.tasks.Task
    consistency: read_your_writes
    naming:
      wire: allTasks
      display: All tasks
    fields:
      - name: id
