# A2A v1.0.1 a2a.proto, TaskStatusUpdateEvent: `status` is REQUIRED ("The new status of the
# task"). A cancel streams and pushes that event, so its payload carries TASK_STATE_CANCELED.
type: ess-scenario/1
domain: a2a.tasks
scenario: cancel-carries-status
summary: Canceling a task emits TaskStatusUpdated with the status TASK_STATE_CANCELED.

arrange:
  - instance: task
    entity: a2a.tasks.Task

timeline:
  - at: 2026-01-08T09:00:00Z
    command: a2a.tasks.SendMessage
    actor: a2a.tasks.Client
    input:
      message:
        message_id: msg-1
        role: ROLE_USER
        parts:
          - text: hello
    outcome: task-created
    capture: {instance: task, event: a2a.tasks.TaskCreated, field: task_id}

  - at: 2026-01-08T09:00:01Z
    command: a2a.tasks.CancelTask
    actor: a2a.tasks.Client
    input:
      id: {$instance: task}
    outcome: canceled
    events:
      - event: a2a.tasks.TaskStatusUpdated
        payload:
          status:
            state: TASK_STATE_CANCELED
