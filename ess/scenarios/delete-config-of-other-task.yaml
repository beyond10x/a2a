# a2a.proto scopes a configuration to its task: DeleteTaskPushNotificationConfigRequest
# `task_id` is "The parent task resource ID". The other task carries no configuration cfg-1, so
# the delete removes nothing and answers as any idempotent delete does (section 3.1.10); the
# owner's configuration persists (section 3.1.7) and is still found.
type: ess-scenario/1
domain: a2a.tasks
scenario: delete-config-of-other-task
summary: Deleting a configuration id through another task removes nothing; the owner task keeps its configuration.

arrange:
  - instance: owner
    entity: a2a.tasks.Task
  - instance: other
    entity: a2a.tasks.Task

timeline:
  - at: 2026-01-09T09:00:00Z
    command: a2a.tasks.SendMessage
    actor: a2a.tasks.Client
    input:
      message:
        message_id: msg-1
        role: ROLE_USER
        parts:
          - text: first
    outcome: task-created
    capture: {instance: owner, event: a2a.tasks.TaskCreated, field: task_id}

  - at: 2026-01-09T09:00:01Z
    command: a2a.tasks.SendMessage
    actor: a2a.tasks.Client
    input:
      message:
        message_id: msg-2
        role: ROLE_USER
        parts:
          - text: second
    outcome: task-created
    capture: {instance: other, event: a2a.tasks.TaskCreated, field: task_id}

  - at: 2026-01-09T09:00:02Z
    command: a2a.tasks.CreateTaskPushNotificationConfig
    actor: a2a.tasks.Client
    input:
      task_id: {$instance: owner}
      id: cfg-1
      url: https://client.example.test/webhook
    outcome: created

  - at: 2026-01-09T09:00:03Z
    command: a2a.tasks.DeleteTaskPushNotificationConfig
    actor: a2a.tasks.Client
    input:
      task_id: {$instance: other}
      id: cfg-1
    outcome: deleted

  - at: 2026-01-09T09:00:04Z
    command: a2a.tasks.GetTaskPushNotificationConfig
    actor: a2a.tasks.Client
    input:
      task_id: {$instance: owner}
      id: cfg-1
    outcome: found
