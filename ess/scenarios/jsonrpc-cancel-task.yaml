# JSON-RPC method `CancelTask`. A2A v1.0.1 section 5.3: "| Cancel task | `CancelTask` |
# `CancelTask` | `POST /tasks/{id}:cancel` |"; section 9.4.5 `"method": "CancelTask"`,
# `"params": { "id": "task-uuid" }`. Section 3.1.5, Errors: "TaskNotCancelableError: The task
# is not in a cancelable state (e.g., already completed, failed, or canceled)",
# "TaskNotFoundError: The task ID does not exist or is not accessible." Section 3.6.2: "If the
# version is not supported by the interface, agents MUST return a VersionNotSupportedError";
# section 3.3.4: "When a server requests use of an extension marked as `required: true` in the
# Agent Card but the client does not declare support for it, the agent MUST return
# ExtensionSupportRequiredError". Section 5.4:
# "| `TaskNotCancelableError` | `-32002` | `FAILED_PRECONDITION` | `400 Bad Request` |",
# "| `TaskNotFoundError` | `-32001` | `NOT_FOUND` | `404 Not Found` |",
# "| `ExtensionSupportRequiredError` | `-32008` | `FAILED_PRECONDITION` | `400 Bad Request` |",
# "| `VersionNotSupportedError` | `-32009` | `FAILED_PRECONDITION` | `400 Bad Request` |".
# -32008 and -32009 answer before the task lookup (rule above outcome_groups in
# domains/tasks.yaml), so their acts name a task the agent does not hold.
type: ess-scenario/1
domain: a2a.tasks
scenario: jsonrpc-cancel-task
summary: CancelTask cancels a task, answers -32002 when the agent cannot cancel it yet and when it is already canceled, -32001 for an unknown one, and -32008 and -32009 before the task lookup.

arrange:
  - instance: task
    entity: a2a.tasks.Task

timeline:
  - at: 2026-02-05T09:00:00Z
    command: a2a.tasks.SendMessage
    actor: a2a.tasks.Client
    input:
      message:
        message_id: msg-1
        role: ROLE_USER
        parts:
          - text: hello
    outcome: task-created
    capture: {instance: task, event: a2a.tasks.TaskCreated, field: task_id}

  - at: 2026-02-05T09:00:01Z
    command: a2a.tasks.CancelTask
    actor: a2a.tasks.Client
    input:
      id: {$instance: task}
    outcome: not-cancelable-now
    error:
      name: a2a.tasks.TaskNotCancelable
    no_events: [a2a.tasks.TaskStatusUpdated]

  - at: 2026-02-05T09:00:02Z
    command: a2a.tasks.CancelTask
    actor: a2a.tasks.Client
    input:
      id: {$instance: task}
    outcome: canceled

  - at: 2026-02-05T09:00:03Z
    command: a2a.tasks.CancelTask
    actor: a2a.tasks.Client
    input:
      id: {$instance: task}
    outcome: not-cancelable
    error:
      name: a2a.tasks.TaskNotCancelable
    no_events: [a2a.tasks.TaskStatusUpdated]

  - at: 2026-02-05T09:00:04Z
    command: a2a.tasks.CancelTask
    actor: a2a.tasks.Client
    input:
      id: no-such-task
    outcome: not-found
    error:
      name: a2a.tasks.TaskNotFound

  - at: 2026-02-05T09:00:05Z
    command: a2a.tasks.CancelTask
    actor: a2a.tasks.Client
    input:
      id: no-such-task
    outcome: extension-required
    error:
      name: a2a.tasks.ExtensionSupportRequired

  - at: 2026-02-05T09:00:06Z
    command: a2a.tasks.CancelTask
    actor: a2a.tasks.Client
    input:
      id: no-such-task
    outcome: version-not-supported
    error:
      name: a2a.tasks.VersionNotSupported
