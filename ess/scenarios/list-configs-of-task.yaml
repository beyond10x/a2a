# A2A v1.0.1 section 3.1.9: ListTaskPushNotificationConfigs "MUST return all active push
# notification configurations for the specified task" and answers TaskNotFoundError when "The
# task ID does not exist".
type: ess-scenario/1
domain: a2a.tasks
scenario: list-configs-of-task
summary: Listing the configurations of an existing task succeeds.

arrange:
  - instance: task
    entity: a2a.tasks.Task

timeline:
  - at: 2026-01-10T09:00:00Z
    command: a2a.tasks.SendMessage
    actor: a2a.tasks.Client
    input:
      message:
        message_id: msg-1
        role: ROLE_USER
        parts:
          - text: hello
    outcome: task-created
    capture: {instance: task, event: a2a.tasks.TaskCreated, field: task_id}

  - at: 2026-01-10T09:00:01Z
    command: a2a.tasks.CreateTaskPushNotificationConfig
    actor: a2a.tasks.Client
    input:
      task_id: {$instance: task}
      id: cfg-1
      url: https://client.example.test/webhook
    outcome: created

  - at: 2026-01-10T09:00:02Z
    command: a2a.tasks.ListTaskPushNotificationConfigs
    actor: a2a.tasks.Client
    input:
      task_id: {$instance: task}
    outcome: listed
