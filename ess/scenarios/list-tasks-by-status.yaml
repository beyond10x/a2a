# A2A v1.0.1 section 3.1.4, ListTasks: `status` "Filter tasks by their current status state"
# (a2a.proto ListTasksRequest.status). ListTasks is the view a2a.tasks.Tasks; its filter keeps a
# task whose state is the `status` asked for (domains/tasks.yaml). A task that was just created
# and not canceled is not listed under Canceled, and is listed when no status is asked for.
type: ess-scenario/1
domain: a2a.tasks
scenario: list-tasks-by-status
summary: ListTasks with a status lists no task in another state.

timeline:
  - at: 2026-03-04T09:00:00Z
    command: a2a.tasks.SendMessage
    actor: a2a.tasks.Client
    input:
      message:
        message_id: msg-1
        context_id: ctx-status
        role: ROLE_USER
        parts:
          - text: hello
    outcome: task-created

assert:
  - view: a2a.tasks.Tasks
    params:
      context_id: ctx-status
    contains:
      context_id: ctx-status
  - view: a2a.tasks.Tasks
    params:
      context_id: ctx-status
      status: Canceled
    counts:
      at_most: 0
