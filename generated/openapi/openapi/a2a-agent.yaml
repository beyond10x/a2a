  a2a.tasks.Task:
    title: Task
    description: A stateful unit of work an agent runs for a client. Its lifecycle state is the wire `status.state`; the other status members are fields here.
    x-ess-name: a2a.tasks.Task
    x-ess-kind: entity
    type: object
    properties:
      id:
        $ref: '#/x-ess-entities/a2a.tasks.TaskId'
      context_id:
        $ref: '#/x-ess-entities/a2a.tasks.ContextId'
      status_message:
        $ref: '#/x-ess-entities/a2a.tasks.Message'
      status_timestamp:
        type: string
        format: date-time
      artifacts:
        type: array
        items:
          $ref: '#/x-ess-entities/a2a.tasks.Artifact'
      history:
        type: array
        items:
          $ref: '#/x-ess-entities/a2a.tasks.Message'
      metadata: {}
      state:
        $ref: '#/x-ess-entities/a2a.tasks.Task.State'
    required:
    - id
    - context_id
    - state
    additionalProperties: false
  a2a.tasks.Task.State:
    title: State
    x-ess-name: a2a.tasks.Task.State
    x-ess-kind: enum
    type: string
    enum:
    - AuthRequired
    - Canceled
    - Completed
    - Failed
    - InputRequired
    - Rejected
    - Submitted
    - Working
  a2a.tasks.TaskId:
    title: TaskId
    description: Server-generated, opaque task identifier (A2A v1.0.1 section 3.4.2).
    x-ess-name: a2a.tasks.TaskId
    x-ess-kind: newtype
    type: string
