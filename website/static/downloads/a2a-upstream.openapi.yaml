openapi: 3.0.0
info:
  title: a2a.proto
  version: version not set
tags:
  - name: A2AService
paths:
  /extendedAgentCard:
    get:
      summary: Gets the extended agent card for the authenticated agent.
      operationId: A2AService_GetExtendedAgentCard
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1AgentCard"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: tenant
          description: >-
            Optional. Opaque routing identifier. Must match the `tenant` value
            from

            the selected `AgentInterface` in the Agent Card when that field is set.
          in: query
          required: false
          schema:
            type: string
      tags:
        - A2AService
  /message:send:
    post:
      summary: Sends a message to an agent.
      operationId: A2AService_SendMessage
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1SendMessageResponse"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      requestBody:
        $ref: "#/components/requestBodies/v1SendMessageRequest"
      tags:
        - A2AService
  /message:stream:
    post:
      summary: >-
        Sends a streaming message to an agent, allowing for real-time
        interaction and status updates.

        Streaming version of `SendMessage`
      operationId: A2AService_SendStreamingMessage
      responses:
        "200":
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/v1StreamResponse"
                  error:
                    $ref: "#/components/schemas/rpcStatus"
                title: Stream result of v1StreamResponse
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      requestBody:
        $ref: "#/components/requestBodies/v1SendMessageRequest"
      tags:
        - A2AService
  /tasks:
    get:
      summary: Lists tasks that match the specified filter.
      operationId: A2AService_ListTasks
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1ListTasksResponse"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: tenant
          description: >-
            Optional. Opaque routing identifier. Must match the `tenant` value
            from

            the selected `AgentInterface` in the Agent Card when that field is set.
          in: query
          required: false
          schema:
            type: string
        - name: contextId
          description: Filter tasks by context ID to get tasks from a specific
            conversation or session.
          in: query
          required: false
          schema:
            type: string
        - name: status
          description: >-
            Filter tasks by their current status state.

             - TASK_STATE_UNSPECIFIED: The task is in an unknown or indeterminate state.
             - TASK_STATE_SUBMITTED: Indicates that a task has been successfully submitted and acknowledged.
             - TASK_STATE_WORKING: Indicates that a task is actively being processed by the agent.
             - TASK_STATE_COMPLETED: Indicates that a task has finished successfully. This is a terminal state.
             - TASK_STATE_FAILED: Indicates that a task has finished with an error. This is a terminal state.
             - TASK_STATE_CANCELED: Indicates that a task was canceled before completion. This is a terminal state.
             - TASK_STATE_INPUT_REQUIRED: Indicates that the agent requires additional user input to proceed. This is an interrupted state.
             - TASK_STATE_REJECTED: Indicates that the agent has decided to not perform the task.
            This may be done during initial task creation or later once an agent

            has determined it can't or won't proceed. This is a terminal state.
             - TASK_STATE_AUTH_REQUIRED: Indicates that authentication is required to proceed. This is an interrupted state.
          in: query
          required: false
          schema:
            type: string
            enum:
              - TASK_STATE_UNSPECIFIED
              - TASK_STATE_SUBMITTED
              - TASK_STATE_WORKING
              - TASK_STATE_COMPLETED
              - TASK_STATE_FAILED
              - TASK_STATE_CANCELED
              - TASK_STATE_INPUT_REQUIRED
              - TASK_STATE_REJECTED
              - TASK_STATE_AUTH_REQUIRED
            default: TASK_STATE_UNSPECIFIED
        - name: pageSize
          description: >-
            The maximum number of tasks to return. The service may return fewer
            than this value.

            If unspecified, at most 50 tasks will be returned.

            The minimum value is 1.

            The maximum value is 100.
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: pageToken
          description: |-
            A page token, received from a previous `ListTasks` call.
            `ListTasksResponse.next_page_token`.
            Provide this to retrieve the subsequent page.
          in: query
          required: false
          schema:
            type: string
        - name: historyLength
          description: The maximum number of messages to include in each task's history.
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: statusTimestampAfter
          description: >-
            Filter tasks which have a status updated after the provided
            timestamp in ISO 8601 format (e.g., "2023-10-27T10:00:00Z").

            Only tasks with a status timestamp time greater than or equal to this value will be returned.
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: includeArtifacts
          description: |-
            Whether to include artifacts in the returned tasks.
            Defaults to false to reduce payload size.
          in: query
          required: false
          schema:
            type: boolean
      tags:
        - A2AService
  "/tasks/{id}":
    get:
      summary: Gets the latest state of a task.
      operationId: A2AService_GetTask
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1Task"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: id
          description: The resource ID of the task to retrieve.
          in: path
          required: true
          schema:
            type: string
            pattern: "[^/]+"
        - name: tenant
          description: >-
            Optional. Opaque routing identifier. Must match the `tenant` value
            from

            the selected `AgentInterface` in the Agent Card when that field is set.
          in: query
          required: false
          schema:
            type: string
        - name: historyLength
          description: >-
            The maximum number of most recent messages from the task's history
            to retrieve. An

            unset value means the client does not impose any limit. A value of zero is

            a request to not include any messages. The server MUST NOT return more

            messages than the provided value, but MAY apply a lower limit.
          in: query
          required: false
          schema:
            type: integer
            format: int32
      tags:
        - A2AService
  "/tasks/{id}:cancel":
    post:
      summary: Cancels a task in progress.
      operationId: A2AService_CancelTask
      responses:
        "200":
          description: A successful response.
          content:
