          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: taskId
          description: The ID of the task this configuration is associated with.
          in: path
          required: true
          schema:
            type: string
            pattern: "[^/]+"
      requestBody:
        $ref: "#/components/requestBodies/A2AServiceCreateTaskPushNotificationConfigBod\
          y"
      tags:
        - A2AService
