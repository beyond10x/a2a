          in: path
          required: true
          schema:
            type: string
            pattern: "[^/]+"
      requestBody:
        $ref: "#/components/requestBodies/A2AServiceCancelTaskBody"
      tags:
        - A2AService
  "/tasks/{id}:subscribe":
    get:
      summary: >-
        Subscribes to task updates for tasks not in a terminal state.

        Returns `UnsupportedOperationError` if the task is already in a terminal state (completed, failed, canceled, rejected).
      operationId: A2AService_SubscribeToTask
      responses:
        "200":
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/v1StreamResponse"
                  error:
                    $ref: "#/components/schemas/rpcStatus"
                title: Stream result of v1StreamResponse
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: id
          description: The resource ID of the task to subscribe to.
          in: path
          required: true
          schema:
            type: string
            pattern: "[^/]+"
        - name: tenant
          description: >-
            Optional. Opaque routing identifier. Must match the `tenant` value
            from

            the selected `AgentInterface` in the Agent Card when that field is set.
          in: query
          required: false
          schema:
            type: string
      tags:
        - A2AService
